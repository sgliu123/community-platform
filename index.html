  document.getElementById("loginError").style.display = "none";
}
function hideLogin() {
  document.getElementById("loginModal").classList.remove("active");
}
document.getElementById("loginModal").addEventListener("click", function(e) {
  if (e.target === this) hideLogin();
});

function doLogin() {
  const room = document.getElementById("loginRoom").value.trim();
  const name = document.getElementById("loginName").value.trim();
  const phone = document.getElementById("loginPhone").value.trim();
  const err = document.getElementById("loginError");
  if (!room || !name || !phone) { err.textContent = "请填写完整信息"; err.style.display = "block"; return; }
  const match = (appData.residents||[]).find(r => r.roomNo === room && r.name === name && phone.endsWith(r.phoneSuffix) && r.status === "active");
  if (!match) { err.textContent = "信息不匹配，请联系物业核实"; err.style.display = "block"; return; }
  residentAuth = { isLoggedIn: true, roomNo: match.roomNo, name: match.name, loginTime: new Date().toISOString(), token: Math.random().toString(36).substring(2,18) };
  localStorage.setItem("residentAuth", JSON.stringify(residentAuth));
  hideLogin(); updateUserUI(); render(); alert("✅ 登录成功！");
  if (window._pendingPollId) {
    const p = (appData.polls||[]).find(x => x.id === window._pendingPollId);
    if (p && p.tencentUrl) { setTimeout(() => window.open(p.tencentUrl, '_blank'), 300); }
    window._pendingPollId = null;
  }
}

function doLogout() {
  if (confirm("确定要退出登录吗？")) {
    localStorage.removeItem("residentAuth"); residentAuth = null;
    updateUserUI(); navigate("home");
  }
}

function updateUserUI() {
  const btn = document.getElementById("loginBtn");
  const span = document.getElementById("userName");
  if (residentAuth) { btn.textContent = "退出"; btn.onclick = doLogout; span.textContent = residentAuth.name; span.style.cursor="pointer"; span.style.textDecoration="underline"; span.onclick=function(){navigate('profile');}; span.title="点击打开个人中心"; }
  else { btn.textContent = "业主登录"; btn.onclick = showLogin; span.textContent = ""; span.style.cursor=""; span.style.textDecoration=""; span.onclick=null; span.title=""; }
}

let carouselTimer = null;
function initCarousel() {
  if (carouselTimer) clearInterval(carouselTimer);
  const items = document.querySelectorAll(".carousel-item");
  const dots = document.querySelectorAll(".carousel-dots span");
  if (items.length <= 1) return;
  let cur = 0;
  carouselTimer = setInterval(() => {
    items[cur].classList.remove("active"); if (dots[cur]) dots[cur].classList.remove("active");
    cur = (cur + 1) % items.length;
    items[cur].classList.add("active"); if (dots[cur]) dots[cur].classList.add("active");
  }, 4000);
}
function goCarousel(index) {
  const items = document.querySelectorAll(".carousel-item");
  const dots = document.querySelectorAll(".carousel-dots span");
  items.forEach((item,i) => item.classList.toggle("active", i === index));
  dots.forEach((dot,i) => dot.classList.toggle("active", i === index));
}

function stripHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || "";
}
function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function formatDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

document.addEventListener("DOMContentLoaded", async () => {

      closeImagePreview();
      var extModal = document.querySelector('.external-modal.active');

    }
  });
  applyTheme(currentTheme); renderThemePanel();

  render();

  // ===== 实时刷新机制：实现"秒显示"效果 =====

  // 1) 页面从后台切回前台时自动刷新数据
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      loadData().then(() => {
        const r = getRoute();
        // 只有列表页/首页切回前台时才重新渲染
        if (isRealtimePage(r.page)) {

        // 详情页保持当前视图，数据已在内存中静默更新
      }).catch(e => console.error('Visibility refresh failed', e));
    }
  });

  // 2) 每10秒自动刷新一次关键数据
  setInterval(() => {
    if (document.hidden) return;
    const r = getRoute();
    if (isRealtimePage(r.page)) {
      // 列表页/首页：加载数据后重新渲染，确保用户看到最新内容
      loadData().then(() => render()).catch(() => {});

      // 详情页：静默加载数据到内存，不重新渲染 DOM（避免打断视频播放、重置滚动位置）
      loadData().catch(() => {});
    }
  }, 10000);
});

/* ===== Image Compression & Preview Utilities ===== */
function formatFileSize(bytes) {
  if (bytes === 0) return '0 B';
  var k = 1024;
  var sizes = ['B', 'KB', 'MB', 'GB'];
  var i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function compressImage(file, options) {
  options = options || {};
  var maxWidth = options.maxWidth || 800;
  var maxHeight = options.maxHeight || 800;
  var quality = options.quality || 0.4;
  var maxSize = options.maxSize || 50 * 1024;
  return new Promise(function(resolve, reject) {
    if (!file || !file.type.match(/image.*/)) { resolve(file); return; }
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(url);
      var width = img.width, height = img.height;
      if (width > maxWidth || height > maxHeight) {
        var ratio = Math.min(maxWidth / width, maxHeight / height);
        width = Math.floor(width * ratio);
        height = Math.floor(height * ratio);
      }
      var canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      function toBlob(q, cb) {
        canvas.toBlob(function(blob) { cb(blob); }, 'image/jpeg', q);
      }
      function tryCompress(q) {
        toBlob(q, function(blob) {
          if (!blob) { reject(new Error('压缩失败')); return; }
          if (blob.size > maxSize && q > 0.3) {
            tryCompress(Math.max(q - 0.15, 0.3));
          } else {
            var newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
            var newFile = new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() });
            resolve(newFile);
          }
        });
      }
      tryCompress(quality);
    };
    img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}

let _woImages=[];
let _cpImages=[];
async function handleWOImages(input) {
  var files = Array.from(input.files).slice(0, 3);
  var preview = document.getElementById('woImagesPreview');
  preview.innerHTML = '<div style="width:100%;text-align:center;padding:12px;color:var(--text-secondary);font-size:13px;" id="woCompressStatus">正在处理图片，请稍候...</div>';
  _woImages = [];
  var processed = 0;
  for (var i = 0; i < files.length; i++) {
    try {
      var f = files[i];
      var compressed = await compressImage(f, { maxWidth: 800, maxHeight: 800, quality: 0.4, maxSize: 50 * 1024 });
      _woImages.push(compressed);
      var url = URL.createObjectURL(compressed);
      var sizeHtml = '<div style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,0.6);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;backdrop-filter:blur(2px);">' + formatFileSize(compressed.size) + '</div>';
      var badgeHtml = compressed.size < f.size 
        ? '<div style="position:absolute;top:2px;right:2px;background:var(--primary);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;">已压缩</div>' 
        : '';
      preview.innerHTML += '<div style="width:80px;height:80px;border-radius:6px;overflow:hidden;border:1px solid var(--border);position:relative;flex-shrink:0;"><img src="' + url + '" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">' + sizeHtml + badgeHtml + '</div>';
      processed++;
    } catch (e) {
      // 压缩失败则使用原图
      _woImages.push(files[i]);
      var url = URL.createObjectURL(files[i]);
      preview.innerHTML += '<div style="width:80px;height:80px;border-radius:6px;overflow:hidden;border:1px solid var(--border);position:relative;flex-shrink:0;"><img src="' + url + '" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy"><div style="position:absolute;bottom:2px;left:2px;background:rgba(200,0,0,0.7);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;">原图</div></div>';
      processed++;
    }
  }
  var statusEl = document.getElementById('woCompressStatus');
  if (statusEl) statusEl.style.display = 'none';
  if (processed === 0) preview.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;">未选择图片</div>';
}

function renderComplaintDetail(id){
  const list=appData._complaints||[];
  const item=list.find(x=>x.id===id);
  if(!item){
    if(residentAuth && !appData._cpLoading){
      appData._cpLoading=true;
      loadMyComplaints().then(function(loaded){
        appData._complaints=loaded;
        appData._cpLoading=false;
        var r=getRoute();
        if(r.page==='complaint-detail' && r.params===id){
          document.getElementById('main').innerHTML='<div class="page-content">'+renderComplaintDetail(id)+'</div>';
        }

        appData._cpLoading=false;
        var r=getRoute();
        if(r.page==='complaint-detail' && r.params===id){
          document.getElementById('main').innerHTML='<div class="page-content"><div class="empty">加载失败，请刷新重试</div></div>';
        }
      });

    }
    return '<div class="empty">记录不存在</div>';
  }
  let h='<div class="card"><div class="detail-header"><h1>'+(item.isAnonymous?'匿名'+item.type:escapeHtml(item.title))+'</h1>';
  h+='<div class="detail-meta"><span class="list-badge '+cpStatusBadge(item.status)+'">'+item.status+'</span>';
  h+='<span>类型：'+item.type+'</span><span>编号：'+item.id+'</span><span>提交：'+formatDate(item.createdAt)+'</span></div></div>';
  h+='<div class="detail-content"><p>'+escapeHtml(item.content)+'</p></div>';
  h += renderPhotoGallery(item.images, '相关图片（业主上传）', '#e65100');
  var replyImages = item.replyImages || item.adminImages || [];
  if (replyImages.length > 0) {
    h += renderPhotoGallery(replyImages, '已上传回复图片', 'var(--primary)');
  }
  h+='<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);"><div style="font-weight:600;margin-bottom:12px;">📋 处理节点记录</div>';
  var timeline = item.timeline || [];
  if (!timeline.length && item.reply) {
    timeline = [{
      time: item.replyAt || item.updatedAt,
      action: '物业回复',
      operator: item.handler || '管理员',
      content: item.reply
    }];
  }
  if(!timeline.length){h+='<div style="font-size:13px;color:var(--text-secondary);padding:8px 0;">暂无处理记录</div>';}
  else{
    timeline.forEach(function(t,idx){
      var isLast=idx===timeline.length-1;
      h+='<div style="position:relative;padding-left:28px;margin-bottom:16px;">';
      if(!isLast) h+='<div style="position:absolute;left:8px;top:14px;bottom:-16px;width:2px;background:#e0e0e0;"></div>';
      h+='<div style="position:absolute;left:2px;top:6px;width:12px;height:12px;background:var(--primary);border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--primary);z-index:1;"></div>';
      h+='<div style="background:#f8f9fa;border-radius:8px;padding:12px 14px;border:1px solid #eef0f2;">';
      h+='<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">';
      h+='<span>🕐 '+formatDateTime(t.time)+'</span>';
      h+='<span>👤 '+escapeHtml(t.operator || item.handler || '管理员')+'</span>';
      h+='</div>';
      if (t.action) {
        h+='<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;">'+escapeHtml(t.action)+'</div>';
      }
      var contentText = t.content || t.reply || '';
      if (contentText) {
        h+='<div style="font-size:14px;color:var(--text);line-height:1.6;">'+escapeHtml(contentText)+'</div>';
      }
      h+='</div></div>';
    });
  }
  h+='</div>';
  if(item.reply){
    h+='<div style="margin-top:16px;padding:16px;background:#e3f2fd;border-radius:8px;border-left:4px solid var(--primary);">';
    h+='<div style="font-weight:600;margin-bottom:6px;">📢 物业回复</div><div>'+escapeHtml(item.reply)+'</div>';
    h+='<div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">'+formatDateTime(item.replyAt)+'</div></div>';
    if(item.status==='已回复'){
      h+='<div style="margin-top:12px;"><div style="font-weight:600;margin-bottom:8px;">您对处理结果是否满意？</div>';
      h+='<button class="action-btn primary" onclick="doCPSatisfaction(\''+item.id+'\',true)">👍 满意</button>';
      h+='<button class="action-btn secondary" style="margin-left:8px;" onclick="doCPSatisfaction(\''+item.id+'\',false)">👎 不满意</button></div>';
    }

  if(item.satisfaction!==null){
    h+='<div style="margin-top:16px;padding:14px;background:#e8f5e9;border-radius:8px;font-size:14px;font-weight:500;">';
    h+='💬 您的满意度反馈：'+(item.satisfaction?'👍 满意':'👎 不满意');
    h+='</div>';
  }
  h+='<div style="margin-top:20px;"><button class="poll-btn" onclick="history.back()">← 返回</button></div></div>';
  return h;
}
async function doCPSatisfaction(id,sat){

    alert('感谢您的反馈'); navigate('complaint-detail', id);
  }catch(e){ alert('操作失败：'+e.message); }

}


function renderPhotoGallery(images, title, color) {
  if (!images || !images.length) return '';
  color = color || 'var(--primary)';
  var gid = 'pg-' + Math.random().toString(36).substr(2, 6);
  var h = '<div style="margin-top:16px;" id="' + gid + '">';
  h += '<div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:6px;">';
  h += '<span style="display:inline-block;width:4px;height:14px;background:' + color + ';border-radius:2px;"></span>';
  h += escapeHtml(title) + ' <span style="font-weight:400;color:#999;">(' + images.length + '张)</span></div>';
  h += '<div class="photo-grid">';
  images.forEach(function(url, idx) {
    var safeUrl = url.replace(/'/g, "\'");
    var thumbUrl = url;
    var fallbackUrl = '';
    var ghMatch = url.match(/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)/);
    if (ghMatch) {
      fallbackUrl = 'https://cdn.jsdelivr.net/gh/' + ghMatch[1] + '/' + ghMatch[2] + '@' + ghMatch[3] + '/' + ghMatch[4];
    }
    h += '<div class="photo-item" data-src="' + thumbUrl + '" data-fallback="' + fallbackUrl + '" data-preview="' + safeUrl + '" onclick="openImagePreview(this.dataset.preview)">';
    h += '<div class="photo-skeleton"></div>';
    h += '<img data-src="' + thumbUrl + '" data-fallback="' + fallbackUrl + '" alt="图片' + (idx+1) + '" onload="this.classList.add(\'loaded\');var sk=this.parentElement.querySelector(\'.photo-skeleton\');if(sk)sk.style.display=\'none\'" onerror="retryPhotoLoad(this)">';
    h += '<div class="photo-overlay"><span>🔍 查看大图</span></div>';
    h += '</div>';
  });
  h += '</div></div>';
  setTimeout(function() { initPhotoLazyLoad(gid); }, 50);
  return h;
}

function retryPhotoLoad(img) {
  var retries = parseInt(img.dataset.retries || '0');
  var src = img.dataset.src;
  var fallback = img.dataset.fallback;
  if (retries < 2) {
    img.dataset.retries = (retries + 1).toString();
    setTimeout(function() {
      img.src = src + (src.indexOf('?') > -1 ? '&' : '?') + '_retry=' + retries;
    }, 300 * (retries + 1));
  } else if (fallback && retries < 4) {
    img.dataset.retries = (retries + 1).toString();
    setTimeout(function() {
      img.src = fallback;
    }, 500);
  } else {
    img.parentElement.classList.add('error');
    img.style.display = 'none';
  }
}

function initPhotoLazyLoad(gid) {
  var container = document.getElementById(gid);
  if (!container) return;
  var imgs = container.querySelectorAll('img[data-src]');
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var img = entry.target;
          if (!img.src && img.dataset.src) {
            img.src = img.dataset.src;
          }
          observer.unobserve(img);
        }
      });
    }, { rootMargin: '200px', threshold: 0.01 });
    imgs.forEach(function(img) { observer.observe(img); });
  } else {
    imgs.forEach(function(img) {
      if (img.dataset.src) img.src = img.dataset.src;
    });
  }
}
function openImagePreview(url) {
  var modal = document.getElementById('imagePreviewModal');
  var img = document.getElementById('imagePreviewImg');
  var loader = document.getElementById('imagePreviewLoader');
  if (!modal || !img) return;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  img.style.opacity = '0';
  if (loader) loader.style.display = 'block';
  img.onload = function() {
    img.style.opacity = '1';
    if (loader) loader.style.display = 'none';
  };
  img.onerror = function() {
    if (loader) { loader.style.display = 'none'; loader.innerHTML = '<div style="color:#fff;font-size:16px;">⚠️ 图片加载失败</div>'; loader.style.display = 'block'; }
  };
  img.src = url;
}

function closeImagePreview() {
  var modal = document.getElementById('imagePreviewModal');
  if (modal) modal.style.display = 'none';
  document.body.style.overflow = '';
  var img = document.getElementById('imagePreviewImg');
  if (img) { img.src = ''; img.onload = null; img.onerror = null; }
}

function escapeHtml(text){
  if(!text) return '';
  const div=document.createElement('div');
  div.textContent=text;
  return div.innerHTML;
}

  <div id="imagePreviewLoader" style="position:absolute;display:none;"><div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div></div>
  <img id="imagePreviewImg" style="max-width:92vw;max-height:88vh;object-fit:contain;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:opacity 0.3s;opacity:0;" onclick="event.stopPropagation()">
  <div style="margin-top:12px;color:rgba(255,255,255,0.6);font-size:12px;">点击空白处关闭 · 支持 ESC 键</div>
  <button onclick="closeImagePreview()" style="position:absolute;top:16px;right:16px;width:40px;height:40px;background:rgba(255,255,255,0.15);border:none;border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:all 0.2s;z-index:10;">✕</button>
</div>
<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
/* ===== Global Search ===== */
function doGlobalSearch(keyword) {
  var dropdown = document.getElementById('globalSearchDropdown');
  if (!dropdown) return;
  if (!keyword || keyword.length < 1) { dropdown.classList.remove('active'); return; }
  var kw = keyword.toLowerCase();
  var results = [];
  (appData.announcements || []).forEach(function(a) {
    if (a.title && a.title.toLowerCase().indexOf(kw) !== -1) {
      results.push({ type: '公告', title: a.title, page: 'announcement-detail', id: a.id, meta: (a.publishDate || '') + ' · ' + (a.author || '') });
    }
  });
  (appData.activities || []).forEach(function(a) {
    if (a.title && a.title.toLowerCase().indexOf(kw) !== -1) {
      results.push({ type: '活动', title: a.title, page: 'activity-detail', id: a.id, meta: (a.date || '') + ' · ' + (a.location || '') });
    }
  });
  (appData.documents || []).forEach(function(d) {
    if (d.title && d.title.toLowerCase().indexOf(kw) !== -1) {
      results.push({ type: '文件', title: d.title, page: 'document-detail', id: d.id, meta: (d.publishDate || '') + ' · ' + (d.source || '') });
    }
  });
  (appData.polls || []).forEach(function(p) {
    if (p.title && p.title.toLowerCase().indexOf(kw) !== -1) {
      results.push({ type: '投票', title: p.title, page: 'poll-detail', id: p.id, meta: p.status + ' · ' + (p.endDate || '') });
    }
  });
  if (!results.length) {
    dropdown.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:13px;">未找到相关内容</div>';
  } else {
    var h = '';
    var types = ['公告', '活动', '文件', '投票'];
    types.forEach(function(t) {
      var items = results.filter(function(r) { return r.type === t; });
      if (items.length) {
        h += '<div class="search-section">' + t + '</div>';
        items.slice(0, 4).forEach(function(item) {
          h += '<div class="search-item" onclick="navigate('' + item.page + '','' + item.id + '');closeSearchDropdown();">';
          h += '<div class="search-item-title">' + escapeHtml(item.title) + '</div>';
          h += '<div class="search-item-meta">' + item.meta + '</div></div>';
        });
      }
    });
    dropdown.innerHTML = h;
  }
  dropdown.classList.add('active');
}
function closeSearchDropdown() {
  var d = document.getElementById('globalSearchDropdown');
  var inp = document.getElementById('globalSearchInput');
  if (d) d.classList.remove('active');
  if (inp) inp.value = '';
}

/* ===== Back to Top ===== */
function initBackToTop() {
  var btn = document.getElementById('backToTop');
  if (!btn) return;
  window.addEventListener('scroll', function() {
    btn.classList.toggle('visible', window.scrollY > 300);
  });
}

/* ===== Header Theme Select Init ===== */
function initHeaderThemeSelect() {
  var sel = document.getElementById('headerThemeSelect');
  if (!sel) return;
  sel.innerHTML = Object.entries(themes).map(function(kv) {
    return '<option value="' + kv[0] + '">' + kv[1].name + '</option>';
  }).join('');
  sel.value = currentTheme;
}

/* ===== Click outside to close search ===== */
document.addEventListener('click', function(e) {
  var searchWrap = document.querySelector('.global-search');
  if (searchWrap && !searchWrap.contains(e.target)) closeSearchDropdown();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeSearchDropdown();
    closeImagePreview();
    var extModal = document.querySelector('.external-modal.active');
    if (extModal) closeExternalModal(extModal.id);
  }
});

/* ===== Init calls ===== */
initHeaderThemeSelect();
initBackToTop();
</script>
</body>
</html>
