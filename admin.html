let _woAdminImages = [];
let _cpReplyImages = [];
async function handleWOAdminImages(input){
  const files=Array.from(input.files).slice(0,3);
  const preview=document.getElementById('woAdminImagesPreview');
  preview.innerHTML=''; _woAdminImages=[];
  for(const f of files){
    let file=f;
    if(f.type.startsWith('image/')){
      try{ file=await compressImageToBlob(f,0.03); }catch(e){ showToast('图片压缩失败：'+e.message,'error'); continue; }
    }
    const url=URL.createObjectURL(file);
    preview.innerHTML+='<div style="width:60px;height:60px;border-radius:4px;overflow:hidden;border:1px solid var(--border);"><img src="'+url+'" style="width:100%;height:100%;object-fit:cover;"></div>';
    _woAdminImages.push(file);
  }
}

async function saveWorkorderAction(id){
  const list = appData.workorders || [];
  const checkItem = list.find(x=>x.id===id);
  if(checkItem && checkItem.status === '已完成' && !checkItem.isTest){
    showToast('该工单已完成并锁定，不可修改', 'error');
    return;
  }
  const status = document.getElementById('woNewStatus').value;
  const assignee = document.getElementById('woAssignee').value.trim();
  const workerPhone = document.getElementById('woWorkerPhone').value.trim();
  const reply = document.getElementById('woReply').value.trim();
  showLoading(true);
  try{
    // 优先从内存中获取记录，避免跨月份或数据不同步导致找不到
    let woList = appData.workorders || [];
    let item = woList.find(x=>x.id===id);

    // 如果内存中没有，尝试从当前月份文件读取（兼容旧逻辑）
    if(!item){
      const path = getCurrentMonthPath('workorders');
      woList = await workerRead(path);
      item = woList.find(x=>x.id===id);
    }

    if(!item) throw new Error('工单不存在或已过期，请刷新页面后重试');
    if(item.status === '已完成' && !item.isTest){
      throw new Error('该工单已完成并锁定，不可修改');
    }
    const oldStatus = item.status;
    item.status = status;
    item.assignedTo = assignee;
    item.workerPhone = workerPhone;
    if(reply){
      item.timeline = item.timeline || [];
      item.timeline.push({time:new Date().toISOString(), action:reply, operator:(currentAdmin&&currentAdmin.name)||'管理员', status: status});
    }
    if(assignee && oldStatus==='待受理' && status==='待受理') item.status='已派单';
    if(reply && (status==='已派单'||status==='处理中')) item.status='处理中';
    if(status==='已完成' && (item.rating===undefined || item.rating===null)) item.status='待评价';
    item.updatedAt = new Date().toISOString();
    for(const f of _woAdminImages){
      const r = await workerUpload(f);
      item.adminImages = item.adminImages || [];
      item.adminImages.push(r.url || r);
    }
    _woAdminImages = [];
    const path = getCurrentMonthPath('workorders');
    await workerWrite(path, woList, '管理员处理工单 '+id);
    appData.workorders = woList;
    // 追加审计日志
    appendAuditLog('workorder-update', 'workorders', id, '管理员处理工单 ' + id + '，状态：' + item.status);
    closeModal();
    showToast('处理成功', 'success');
    navigateTo('workorders');
  }catch(e){ showToast('处理失败：'+e.message, 'error'); }
  finally{ showLoading(false); }
}

async function handleCPReplyImages(input){
  const files = Array.from(input.files);
  const preview = document.getElementById('cpReplyImagesPreview');
  const countEl = document.getElementById('cpReplyImgCount');
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    let file = f;
    try{ file = await compressImageToBlob(f, 0.03); }
    catch(e){ showToast('"'+f.name+'" 压缩失败：'+e.message, 'error'); continue; }
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.style.cssText = 'position:relative;width:60px;height:60px;border-radius:4px;overflow:hidden;border:1px solid var(--border);';
    div.dataset.fname = file.name;
    div.innerHTML = '<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;"><button type="button" onclick="removeCPReplyImage(this)" style="position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;">×</button>';
    preview.appendChild(div);
    _cpReplyImages.push(file);
  }
  if(countEl) countEl.textContent = _cpReplyImages.length;
  input.value = '';
}
function removeCPReplyImage(btn){
  const div = btn.parentElement;
  const fname = div.dataset.fname;
  _cpReplyImages = _cpReplyImages.filter(f => f.name !== fname);
  div.remove();
  const countEl = document.getElementById('cpReplyImgCount');
  if(countEl) countEl.textContent = _cpReplyImages.length;
}

async function saveComplaintAction(id){
  const reply = document.getElementById('cpReply').value.trim();
  const action = document.getElementById('cpAction').value;
  if(action==='reply' && !reply){ alert('请填写回复内容'); return; }
  showLoading(true);
  try{
    // 优先从内存中获取记录，避免跨月份或数据不同步导致找不到
    let cpList = appData.complaints || [];
    let item = cpList.find(x=>x.id===id);

    // 如果内存中没有，尝试从当前月份文件读取（兼容旧逻辑）
    if(!item){
      const path = getCurrentMonthPath('complaints');
      cpList = await workerRead(path);
      item = cpList.find(x=>x.id===id);
    }

    if(!item) throw new Error('记录不存在或已过期，请刷新页面后重试');
    if(reply){ item.reply = reply; item.replyAt = new Date().toISOString(); }

    item.handler = currentAdmin && currentAdmin.name || '管理员';
    item.updatedAt = new Date().toISOString();
    item.timeline = item.timeline || [];
    item.timeline.push({time:new Date().toISOString(), action: action==='close'?'直接办结':('回复：'+reply), operator: item.handler, status: item.status});
    // 上传回复图片（不限制数量，逐个上传，高强度压缩）

    for(const f of _cpReplyImages){
      try{

    appData.complaints = cpList;
    // 追加审计日志

}

    text += '指派维修工：'+item.assignedTo+'\n';
    text += '维修工电话：'+(item.workerPhone||'')+'\n\n';
  }
  if(item.timeline && item.timeline.length){

  let text = '投诉建议处理总结\n';
  text += '================================\n';
  text += '编号：'+item.id+'\n';
  text += '类型：'+(item.type||'')+'\n';
  text += '标题：'+(item.isAnonymous?'匿名'+item.type:(item.title||''))+'\n';
  text += '房号：'+(item.residentRoom||'')+'\n';
  text += '业主：'+(item.isAnonymous?'匿名':(item.residentName||''))+'\n';
  text += '当前状态：'+item.status+'\n';
  text += '提交时间：'+formatDateTime(item.createdAt)+'\n';
  text += '内容：'+(item.content||'')+'\n\n';
  if(item.reply){
    text += '【回复记录】\n';
    text += '回复时间：'+formatDateTime(item.replyAt)+'\n';
    text += '处理人：'+(item.handler||'')+'\n';
    text += '回复内容：'+item.reply+'\n\n';
  }
  if(item.timeline && item.timeline.length){
    text += '【处理节点记录】\n';
    item.timeline.forEach(t => {
      text += formatDateTime(t.time) + ' | ' + (t.operator||'系统') + ' | ' + t.action + '\n';
    });
  }
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '投诉建议总结_'+item.id+'.txt';
  a.click();
  URL.revokeObjectURL(url);
}





/* ========== 本地问卷后台管理功能 ========== */

function onPollModeChange() {
  const mode = document.getElementById('edPollMode').value;
  const tencentSec = document.getElementById('tencentSection');
  const localSec = document.getElementById('localSection');
  if(tencentSec) tencentSec.style.display = mode === 'tencent' ? 'block' : 'none';
  if(localSec) localSec.style.display = mode === 'local' ? 'block' : 'none';
}

let _pollQuestions = [];

function onPollCategoryChange() {
  const cat = document.getElementById('edCategory').value;
  const thInput = document.getElementById('edThresholdDisplay');
  if (!thInput) return;
  if (cat === 'major') {
    thInput.value = '参与双三分之二(66.67%) + 同意双四分之三(75%)';
  } else if (cat === 'general') {
    thInput.value = '参与双三分之二(66.67%) + 同意双过半(50%)';
  } else {
    thInput.value = '— 请先选择事项类型 —';
  }
}

function validatePollCompliance() {
  const errors = [];
  const category = document.getElementById('edCategory').value;
  if (!category) errors.push('必须选择事项类型（一般/重大）');

  const ruleFiles = getMultiUploadedPaths('pollRuleFiles');
  if (!ruleFiles || ruleFiles.length === 0) errors.push('必须上传议事规则PDF');

  const rollFiles = getMultiUploadedPaths('pollRollFiles');
  if (!rollFiles || rollFiles.length === 0) errors.push('必须上传业主清册PDF');

  const rollStart = document.getElementById('edRollStart').value;
  const rollEnd = document.getElementById('edRollEnd').value;
  const startDate = document.getElementById('edStart').value;
  if (!rollStart || !rollEnd) {
    errors.push('必须填写业主清册公示起止日期');
  } else if (!startDate) {
    errors.push('必须填写投票开始日期，才能校验公示期');
  } else {
    const endDate = new Date(rollEnd);
    const voteStart = new Date(startDate);
    // 公示结束日期必须在投票开始日期前至少7天
    const minStartDate = new Date(endDate);
    minStartDate.setDate(minStartDate.getDate() + 7);
    minStartDate.setHours(0, 0, 0, 0);
    if (minStartDate > voteStart) {
      errors.push('业主清册公示结束日期必须在投票开始日期前至少7日（公示结束日 + 7天 ≤ 投票开始日）');
    }
  }

  const meetingFiles = getMultiUploadedPaths('pollMeetingFiles');
  if (!meetingFiles || meetingFiles.length === 0) errors.push('必须上传会议通知PDF');

  const streetRecord = document.getElementById('edStreetRecord').value.trim();
  const streetConfirm = document.getElementById('edStreetConfirm').checked;
  if (!streetRecord && !streetConfirm) errors.push('必须填写街道备案号，或勾选"当地无街道备案要求"确认跳过');

  return { valid: errors.length === 0, errors };
}

function renderPollQuestionsEditor(questions) {
  _pollQuestions = JSON.parse(JSON.stringify(questions || []));
  const container = document.getElementById('pollQuestionsEditor');
  if(!container) return;
  if(!_pollQuestions.length) {
    container.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;padding:8px 0;">暂无题目，请点击下方按钮添加</div>';
    return;
  }
  let html = '';
  _pollQuestions.forEach((q, idx) => {
    html += '<div class="poll-q-item" style="background:#fff;border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">';
    html += '<div style="display:flex;gap:8px;margin-bottom:8px;">';
    html += '<span style="font-weight:600;font-size:13px;">题目 ' + (idx+1) + '</span>';
    html += '<button type="button" class="btn btn-sm btn-danger" onclick="removePollQuestion(' + idx + ')" style="margin-left:auto;">删除</button>';
    html += '</div>';
    html += '<div class="form-group" style="margin-bottom:10px;"><label style="font-size:12px;">题目标题</label><input type="text" id="qTitle-' + idx + '" value="' + escapeHtml(q.title||'') + '" placeholder="请输入题目标题"></div>';
    html += '<div class="form-row" style="grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:10px;">';
    html += '<div class="form-group" style="margin-bottom:0;"><label style="font-size:12px;">类型</label><select id="qType-' + idx + '" onchange="onQuestionTypeChange(' + idx + ')"><option value="single" ' + (q.type==='single'?'selected':'') + '>单选</option><option value="multiple" ' + (q.type==='multiple'?'selected':'') + '>多选</option><option value="text" ' + (q.type==='text'?'selected':'') + '>文本</option></select></div>';
    html += '<div class="form-group form-check" style="margin-bottom:0;align-self:flex-end;padding-bottom:8px;"><input type="checkbox" id="qReq-' + idx + '" ' + (q.required?'checked':'') + '><label for="qReq-' + idx + '">必填</label></div>';
    html += '</div>';
    html += '<div id="qOptionsWrap-' + idx + '" style="' + (q.type==='text'?'display:none;':'') + '">';
    html += '<label style="font-size:12px;display:block;margin-bottom:6px;">选项（每行一个）</label>';
    html += '<textarea id="qOpts-' + idx + '" rows="3" placeholder="选项1&#10;选项2&#10;选项3" style="font-family:inherit;">' + escapeHtml((q.options||[]).join('\n')) + '</textarea>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function onQuestionTypeChange(idx) {
  const type = document.getElementById('qType-' + idx).value;
  const wrap = document.getElementById('qOptionsWrap-' + idx);
  if(wrap) wrap.style.display = type === 'text' ? 'none' : 'block';
}

function addPollQuestion() {
  _pollQuestions.push({ id: 'q-' + Date.now() + '-' + Math.random().toString(36).substr(2,4), title: '', type: 'single', options: ['选项1','选项2'], required: true });
  renderPollQuestionsEditor(_pollQuestions);
}

function removePollQuestion(idx) {
  _pollQuestions.splice(idx, 1);
  renderPollQuestionsEditor(_pollQuestions);
}

function collectPollQuestions() {
  const questions = [];
  _pollQuestions.forEach((q, idx) => {
    const title = document.getElementById('qTitle-' + idx).value.trim();
    if(!title) return;
    const type = document.getElementById('qType-' + idx).value;
    const required = document.getElementById('qReq-' + idx).checked;
    let options = [];
    if(type !== 'text') {
      const optsText = document.getElementById('qOpts-' + idx).value;
      options = optsText.split('\n').map(s => s.trim()).filter(s => s);
    }
    questions.push({ id: q.id || ('q-' + Date.now() + '-' + idx), title, type, options, required });
  });
  return questions;
}

async function viewPollData(pollId) {
  const p = (appData.polls||[]).find(x => x.id === pollId);
  if(!p) return;
  showLoading(true);
  let responses = [];
  try {
    const d = new Date();
    const path = 'polls-responses/' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '.json';
    responses = await workerRead(path);
    responses = responses.filter(x => x.pollId === pollId);
  } catch(e) { responses = []; }
  showLoading(false);

  document.getElementById('modalTitle').textContent = '📊 问卷数据：' + p.title;
  let body = '<div style="margin-bottom:12px;"><span style="font-size:13px;color:var(--text-secondary);">共 ' + responses.length + ' 人参与</span>';
  body += '<button class="btn btn-sm" onclick="downloadPollData(\'' + pollId + '\')" style="margin-left:12px;">📥 下载CSV</button></div>';

  if(!responses.length) {
    body += '<div class="empty-state"><div class="icon">📊</div><div>暂无数据</div></div>';
  } else {
    body += '<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>房号</th><th>姓名</th><th>提交时间</th>';
    (p.questions||[]).forEach(q => {
      body += '<th>' + escapeHtml(q.title) + '</th>';
    });
    body += '</tr></thead><tbody>';
    responses.forEach(r => {
      body += '<tr><td>' + (r.residentRoom||'') + '</td><td>' + (r.residentName||'') + '</td><td>' + formatDateTime(r.createdAt) + '</td>';
      (p.questions||[]).forEach(q => {
        const ans = r.answers.find(a => a.questionId === q.id);
        let val = '';
        if(ans) {
          if(Array.isArray(ans.value)) val = ans.value.join(', ');
          else val = ans.value;
        }
        body += '<td>' + escapeHtml(val) + '</td>';
      });
      body += '</tr>';
    });
    body += '</tbody></table></div>';

    body += '<div style="margin-top:20px;"><div style="font-weight:600;margin-bottom:12px;">📈 选项统计</div>';
    (p.questions||[]).forEach(q => {
      if(q.type === 'text') return;
      body += '<div style="background:#fafafa;border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">';
      body += '<div style="font-weight:600;margin-bottom:8px;">' + escapeHtml(q.title) + '</div>';
      const counts = {};
      (q.options||[]).forEach(opt => counts[opt] = 0);
      responses.forEach(r => {
        const ans = r.answers.find(a => a.questionId === q.id);
        if(!ans || !ans.value) return;
        if(Array.isArray(ans.value)) {
          ans.value.forEach(v => { if(counts[v] !== undefined) counts[v]++; });
        } else {
          if(counts[ans.value] !== undefined) counts[ans.value]++;
        }
      });
      const total = responses.length || 1;
      (q.options||[]).forEach(opt => {
        const c = counts[opt] || 0;
        const pct = Math.round(c / total * 100);
        body += '<div style="margin-bottom:6px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;"><span>' + escapeHtml(opt) + '</span><span>' + c + ' (' + pct + '%)</span></div>';
        body += '<div style="background:#e0e0e0;border-radius:4px;height:16px;overflow:hidden;"><div style="height:100%;background:var(--primary);width:' + pct + '%;"></div></div></div>';
      });
      body += '</div>';
    });
    body += '</div>';
  }

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = '<button class="btn" onclick="closeModal()">关闭</button>';
  document.getElementById('modalOverlay').classList.add('active');
}

async function downloadPollData(pollId) {
  const p = (appData.polls||[]).find(x => x.id === pollId);
  if(!p) return;
  showLoading(true);
  let responses = [];
  try {
    const d = new Date();
    const path = 'polls-responses/' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '.json';
    responses = await workerRead(path);
    responses = responses.filter(x => x.pollId === pollId);
  } catch(e) { responses = []; }
  showLoading(false);

  let csv = '\uFEFF';
  csv += '房号,姓名,提交时间';
  (p.questions||[]).forEach(q => {
    csv += ',"' + (q.title||'').replace(/"/g, '""') + '"';
  });
  csv += '\n';

  responses.forEach(r => {
    csv += (r.residentRoom||'') + ',' + (r.residentName||'') + ',"' + (r.createdAt||'') + '"';
    (p.questions||[]).forEach(q => {
      const ans = r.answers.find(a => a.questionId === q.id);
      let val = '';
      if(ans) {
        if(Array.isArray(ans.value)) val = ans.value.join(', ');
        else val = ans.value;
      }
      csv += ',"' + val.replace(/"/g, '""') + '"';
    });
    csv += '\n';
  });

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '问卷数据_' + (p.caseNo||pollId) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function previewImage(url){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;transition:opacity .2s;';
  ov.innerHTML = '<img src="'+url+'" style="max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.4);transform:scale(0.95);transition:transform .2s;">';
  document.body.appendChild(ov);
  requestAnimationFrame(()=>{ ov.style.opacity='1'; ov.querySelector('img').style.transform='scale(1)'; });
  ov.onclick = ()=>{ ov.style.opacity='0'; ov.querySelector('img').style.transform='scale(0.95)'; setTimeout(()=>ov.remove(),200); };
}
