<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<link rel="stylesheet" href="css/admin.css">
  <link rel="icon" id="faviconLink" type="image/png" href="">
<style>#ui-debug-panel,#debug-panel,#console-panel,#log-panel,.ui-debug-panel,.debug-panel,.console-panel,.log-panel,[id*="DebugPanel"],[id*="LogPanel"],[id*="ConsolePanel"]{display:none!important;visibility:hidden!important;height:0!important;}</style></head>
<body>

<div class="login-page" id="loginPage" style="display:none;">
  <div class="login-box">
    <h2>🔐 管理员登录</h2>
    <p class="subtitle">社区小区 · 管理后台</p>
    <div class="error" id="loginError"></div>
    <input type="text" id="loginName" placeholder="请输入用户名（姓名 / 身份名称）" maxlength="30" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);margin:0 0 12px 2px;cursor:pointer;">
      <input type="checkbox" id="loginRemember" checked style="width:auto;margin:0;">在这台电脑上记住我（30 天免登录）
    </label>
    <button id="loginBtn" onclick="doAdminLogin()">登录</button>
    <p class="tip" id="loginTip">个人账号：输入申请时的姓名<br>内置身份：输入「总维护人员 / 物管人员 / 业委会成员 / 社区人员 / 开发者」</p>
    <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);">
      <a href="javascript:void(0)" onclick="showApplyForm()" style="font-size:13px;color:var(--primary);text-decoration:none;">📝 没有账号？申请管理员权限</a>
    </div>
    <div id="applyForm" style="display:none;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);">
      <p class="subtitle" style="margin-bottom:10px;">📝 申请管理员权限（物业 / 业委会 / 社区）</p>
      <div class="error" id="applyError"></div>
      <select id="applyRole" style="width:100%;padding:12px 14px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;">
        <option value="">— 申请身份 —</option>
        <option value="admin-property">🏢 物管人员</option>
        <option value="admin-committee">🏛️ 业委会成员</option>
        <option value="admin-community">🏘️ 社区人员</option>
      </select>
      <input type="text" id="applyName" placeholder="姓名（登录页署名）" maxlength="20">
      <input type="password" id="applyPassword" placeholder="设置登录密码（6位以上）">
      <input type="password" id="applyPassword2" placeholder="再次输入密码">
      <input type="text" id="applyNote" placeholder="申请说明（可选，如：3栋管理员）" maxlength="50">
      <button onclick="doAdminApply()" style="background:var(--primary);">提交申请</button>
      <p class="tip">提交后需总维护人员审批，审批通过即可登录</p>
      <a href="javascript:void(0)" onclick="hideApplyForm()" style="font-size:13px;color:var(--text-secondary);text-decoration:none;">← 返回登录</a>
    </div>
  </div>
</div>

<div class="login-page" id="tokenPage" style="display:none;">
  <div class="login-box">
    <h2>🔑 配置 GitHub Token</h2>
    <p class="subtitle">需要 GitHub Personal Access Token 才能保存数据</p>
    <div class="error" id="tokenError"></div>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
    <input type="text" id="adminName" placeholder="管理员名称（用于审计日志）">
    <input type="text" id="repoName" placeholder="仓库名（如 community-platform，可选）">
    <button onclick="saveToken()">保存并进入后台</button>
    <p class="tip">GitHub Token 已不再需要<br>系统已改用 Cloudflare Worker 进行数据持久化</p>
  </div>
</div>

<div class="admin-layout" id="adminLayout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo" id="siteLogoIcon">⚙️</div>
      <div>
        <div class="title" id="siteLogoTitle">管理后台</div>
        <div class="role" id="adminRole">超级管理员</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div id="adminInfo">管理员A</div>
      <button onclick="logout()">退出登录</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <h1 id="pageTitle">仪表盘</h1>
      <div class="topbar-actions">
        <button onclick="window.open('index.html','_blank')">🌐 查看前台</button>
        <button class="primary" id="saveBtn" onclick="saveCurrentModule()" style="display:none;">💾 保存</button>
      </div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <span class="close" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/admin-utils.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin-upload.js"></script>
<script src="js/admin-polls.js"></script>
<script src="js/admin-pages/dashboard.js"></script>
<script src="js/admin-pages/config.js"></script>
<script src="js/admin-pages/announcements.js"></script>
<script src="js/admin-pages/documents.js"></script>
<script src="js/admin-pages/activities.js"></script>
<script src="js/admin-pages/residents.js"></script>
<script src="js/admin-pages/audit.js"></script>
<script src="js/admin-pages/workorders.js"></script>
<script src="js/admin-pages/complaints.js"></script>
<script src="js/admin-pages/settings.js"></script>
<script src="js/admin-pages/dev-modules.js"></script>
<script src="js/admin-core.js"></script>
<script src="js/admin-app.js"></script>
<script src="js/admin-auth.js"></script>
<script>(function(){function clean(){var s=["#ui-debug-panel","#debug-panel","#console-panel","#log-panel",".ui-debug-panel",".debug-panel",".console-panel",".log-panel"];s.forEach(function(sel){document.querySelectorAll(sel).forEach(function(el){el.remove();});});}clean();setTimeout(clean,300);setTimeout(clean,1000);})();</script></body>
</html>
