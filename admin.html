<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
:root {
  --primary: #2E8B57; --primary-light: #3da76b; --primary-dark: #1f6b41;
  --bg: #f0f2f5; --card: #fff; --text: #333; --text-secondary: #666;
  --border: #e0e0e0; --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 8px; --sidebar-w: 220px; --header-h: 56px;
  --danger: #c62828; --warning: #f9a825; --success: #2e7d32;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }

.login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); }
.login-box { background:#fff; border-radius:16px; padding:40px; width:90%; max-width:420px; box-shadow:0 12px 40px rgba(0,0,0,0.2); }
.login-box h2 { text-align:center; margin-bottom:8px; font-size:22px; }
.login-box .subtitle { text-align:center; color:var(--text-secondary); font-size:14px; margin-bottom:24px; }
.login-box input { width:100%; padding:12px 14px; margin-bottom:12px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
.login-box button { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; font-weight:500; }
.login-box button:hover { background:var(--primary-dark); }
.login-box button:disabled { background:#ccc; cursor:not-allowed; }
.login-box .error { color:var(--danger); font-size:13px; text-align:center; margin-bottom:12px; display:none; }
.login-box .tip { font-size:12px; color:var(--text-secondary); text-align:center; margin-top:12px; }

.admin-layout { display:none; min-height:100vh; }
.admin-layout.active { display:flex; }

.sidebar { width:var(--sidebar-w); background:#fff; border-right:1px solid var(--border); position:fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index:100; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.sidebar-header .logo { width:36px; height:36px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
.sidebar-header .title { font-size:15px; font-weight:600; }
.sidebar-header .role { font-size:11px; color:var(--text-secondary); }
.sidebar-nav { padding:8px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--text); transition:.15s; margin-bottom:2px; }
.nav-item:hover { background:#f5f5f5; }
.nav-item.active { background:var(--primary); color:#fff; }
.nav-item .icon { font-size:18px; width:24px; text-align:center; }
.sidebar-footer { padding:16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-secondary); }
.sidebar-footer button { width:100%; padding:8px; background:#f5f5f5; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:13px; margin-top:8px; }

.main-content { flex:1; margin-left:var(--sidebar-w); min-height:100vh; }
.topbar { height:var(--header-h); background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:50; }
.topbar h1 { font-size:18px; font-weight:600; }
.topbar-actions { display:flex; gap:8px; }
.topbar-actions button { padding:6px 14px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
.topbar-actions button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }

.content-area { padding:24px; max-width:1200px; }

.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px; }
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.card-header h3 { font-size:16px; font-weight:600; }
.card-header .actions { display:flex; gap:8px; }

.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
.stat-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
.stat-card .label { font-size:13px; color:var(--text-secondary); margin-bottom:8px; }
.stat-card .value { font-size:28px; font-weight:700; color:var(--primary); }

.data-table { width:100%; border-collapse:collapse; font-size:14px; }
.data-table th { text-align:left; padding:12px; border-bottom:2px solid var(--border); font-weight:600; color:var(--text-secondary); font-size:13px; }
.data-table td { padding:12px; border-bottom:1px solid var(--border); }
.data-table tr:hover td { background:#fafafa; }
.data-table .actions { display:flex; gap:6px; }
.data-table .actions button { padding:4px 10px; border:1px solid var(--border); background:#fff; border-radius:4px; cursor:pointer; font-size:12px; }
.data-table .actions button.danger { color:var(--danger); border-color:var(--danger); }
.data-table .actions button:hover { background:#f5f5f5; }

.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:inherit; }
.form-group textarea { min-height:120px; resize:vertical; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); }
.form-row { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.form-check { display:flex; align-items:center; gap:8px; }
.form-check input { width:auto; }

.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:6px; font-size:14px; cursor:pointer; border:1px solid var(--border); background:#fff; }
.btn:hover { background:#f5f5f5; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-danger { color:var(--danger); border-color:var(--danger); }
.btn-danger:hover { background:#ffebee; }
.btn-sm { padding:6px 12px; font-size:13px; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal-box { background:#fff; border-radius:12px; width:90%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.2); }
.modal-box .modal-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-box .modal-header h3 { font-size:18px; }
.modal-box .modal-header .close { font-size:24px; cursor:pointer; color:var(--text-secondary); }
.modal-box .modal-body { padding:20px; }
.modal-box .modal-footer { padding:16px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

.toast-container { position:fixed; top:20px; right:20px; z-index:2000; display:flex; flex-direction:column; gap:8px; }
.toast { background:#fff; border-radius:8px; padding:12px 16px; box-shadow:0 4px 16px rgba(0,0,0,0.15); display:flex; align-items:center; gap:10px; min-width:280px; animation:slideIn .3s ease; }
.toast.success { border-left:4px solid var(--success); }
.toast.error { border-left:4px solid var(--danger); }
.toast.info { border-left:4px solid var(--primary); }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

.progress-bar { background:#e0e0e0; border-radius:6px; height:8px; overflow:hidden; }
.progress-bar-fill { height:100%; background:var(--primary); border-radius:6px; }

.tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.tag-test { background:#fff3e0; color:#e65100; }
.tag-active { background:#e8f5e9; color:#2e7d32; }
.tag-disabled { background:#eceff1; color:#546e7a; }

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); transition:.3s; }
  .sidebar.open { transform:translateX(0); }
  .main-content { margin-left:0; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .form-row { grid-template-columns:1fr; }
}

.loading-overlay { position:fixed; inset:0; background:rgba(255,255,255,0.8); z-index:3000; display:none; align-items:center; justify-content:center; }
.loading-overlay.active { display:flex; }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); }
.empty-state .icon { font-size:48px; margin-bottom:16px; }

.batch-textarea { width:100%; min-height:200px; padding:12px; border:1px solid var(--border); border-radius:6px; font-family:monospace; font-size:13px; }

/* 文件上传相关样式 */
.file-upload-wrap { margin-top:8px; }
.file-dropzone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
  background: #fafafa;
}
.file-dropzone:hover, .file-dropzone.drag-over {
  border-color: var(--primary);
  background: #f0f7f4;
}
.file-dropzone .hint { font-size: 12px; margin-top: 6px; color: #999; }
.file-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.file-preview-item {
  position: relative;
  width: 90px; height: 90px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #f5f5f5;
}
.file-preview-item img, .file-preview-item video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.file-preview-item .file-icon {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
}
.file-preview-item .remove {
  position: absolute; top: 2px; right: 2px;
  width: 20px; height: 20px;
  background: rgba(0,0,0,0.6); color: #fff;
  border-radius: 50%; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; line-height: 1;
}
.file-preview-item .file-name {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.6); color: #fff;
  font-size: 10px; padding: 2px 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.upload-progress {
  margin-top: 8px;
  font-size: 12px;
  color: var(--primary);
}

/* 多图上传预览 */
.multi-image-preview {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.multi-preview-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #f5f5f5;
  cursor: default;
}
.multi-preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.multi-preview-item .remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 22px;
  height: 22px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border-radius: 50%;
  border: none;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.multi-preview-item .idx {
  position: absolute;
  bottom: 4px;
  left: 4px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
}

/* Video player optimization for mobile/WeChat */
.video-player-wrap {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}
.video-player-wrap video {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

/* PDF preview badge */
.pdf-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: #ffebee;
  color: #c62828;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}

/* Activity front-end optimized card styles (for data consistency) */
.activity-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.activity-card .cover {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  background: #f5f5f5;
}
.activity-card .body {
  padding: 16px;
}

const WORKER_BASE = localStorage.getItem('workerBase') || 'https://community.firstblade.site';
function getWorkerBase(){ return WORKER_BASE.replace(/\/$/,''); }
function getCurrentMonthPath(module){
  const d=new Date();
  return module+'/'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'.json';
}
async function workerRead(filePath){
  const base=getWorkerBase();
  if(!base){
    const key=filePath.replace(/\.json$/,'').replace(/\//g,'-');
    const cached = appData[key];
    if(cached && Array.isArray(cached) && cached.length > 0) return cached;
    // 尝试从 appData 的模块名直接读取（如 appData.workorders）
    const moduleName = filePath.split('/')[0];
    if(appData[moduleName] && Array.isArray(appData[moduleName]) && appData[moduleName].length > 0) return appData[moduleName];
    return [];
  }
  const res=await fetch(base+'/api/read/'+encodeURIComponent(filePath));
  if(!res.ok) throw new Error('读取失败');
  const t=await res.text();
  return t?JSON.parse(t):[];
}
async function workerWrite(filePath,data,message){
  const base=getWorkerBase();
  if(!base){
    const key=filePath.replace(/\.json$/,'').replace(/\//g,'-');
    appData[key]=data;
    showToast('开发模式：数据仅保存在内存中','info');
    return;
  }
  const res=await fetch(base+'/api/write/'+encodeURIComponent(filePath),{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({content:JSON.stringify(data,null,2),message})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error||'保存失败');}
}
async function workerUpload(file){
  const base=getWorkerBase();
  if(!base){
    return {url:URL.createObjectURL(file),name:file.name};
  }
  const fd=new FormData();fd.append('file',file);
  const res=await fetch(base+'/api/upload',{method:'POST',body:fd});
  if(!res.ok) throw new Error('上传失败');
  return await res.json();
}

async function loadAllData() {
  const files = ['config','announcements','documents','activities','polls','residents','audit-log'];
  const workerBase = getWorkerBase();

  for (const f of files) {
    let loaded = false;
    let workerData = null;

    // 1. 优先从 Worker 读取（已持久化的数据）
    if (workerBase) {
      try {
        const r = await fetch(workerBase + '/api/read/' + encodeURIComponent('data/' + f + '.json') + '?t=' + Date.now());
        if (r.ok) {
          workerData = await r.json();
          // 只有 Worker 返回非空数据才视为加载成功，避免空数组覆盖本地数据
          const isEmpty = (Array.isArray(workerData) && workerData.length === 0) || 
                          (typeof workerData === 'object' && workerData !== null && Object.keys(workerData).length === 0);
          if (!isEmpty) {
            appData[f] = workerData;
            loaded = true;
            continue;
          }
        }
      } catch(e) {}
    }

    // 2. 尝试 fetch 本地 data/ 目录（静态文件）
    if (!loaded) {
      try {
        const r = await fetch('data/' + f + '.json?t=' + Date.now());
        if (r.ok) {
          appData[f] = await r.json();
          loaded = true;
        }
      } catch(e) {}
    }

    // 3. 检查 localStorage（开发模式或回退）
    if (!loaded) {
      try {
        const saved = localStorage.getItem('adminData_' + f);
        if (saved) { appData[f] = JSON.parse(saved); loaded = true; }
      } catch(e) {}
    }

    // 4. 最后回退到 EMBEDDED_DATA（初始默认值）
    if (!loaded) {
      if (typeof EMBEDDED_DATA !== 'undefined' && EMBEDDED_DATA[f] !== undefined) {
        appData[f] = EMBEDDED_DATA[f];
        loaded = true;
      }
    }

    if (!loaded) {
      const defaults = { config: {}, announcements: [], documents: [], activities: [], polls: [], residents: [], 'audit-log': [] };
      appData[f] = defaults[f] || [];
    }
  }
  updateFavicon();
  updatePageTitle();
  // === 数据清洗：移除已失效的 blob URL，防止脏数据持续保存 ===
  if (appData.activities) {
    appData.activities.forEach(item => {
      if (item.images) item.images = item.images.filter(u => !u.startsWith('blob:'));
      if (item.videos) item.videos = item.videos.filter(u => !u.startsWith('blob:'));

      if (item.coverImage && item.coverImage.startsWith('blob:')) item.coverImage = '';
      if (item.videoUrl && item.videoUrl.startsWith('blob:')) item.videoUrl = '';
    });
  }
  if (appData.announcements) {
    appData.announcements.forEach(item => {
      if (item.attachments) item.attachments = item.attachments.filter(att => att.url && !att.url.startsWith('blob:'));
    });
  }
  if (appData.documents) {
    appData.documents.forEach(item => {
      if (item.images) item.images = item.images.filter(u => !u.startsWith('blob:'));
      if (item.attachments) item.attachments = item.attachments.filter(a => a.url && !a.url.startsWith('blob:'));
    });
  }

  // 加载持久化的管理员密码配置（覆盖代码默认值）
  if (appData.config && appData.config.adminAccounts && Array.isArray(appData.config.adminAccounts)) {
    appData.config.adminAccounts.forEach(persisted => {
      const acc = ADMIN_ACCOUNTS.find(a => a.id === persisted.id);
      if (acc && persisted.password) acc.password = persisted.password;
      if (acc && persisted.permissions) acc.permissions = persisted.permissions;
      if (acc && persisted.mustChangePwd === false) acc.mustChangePwd = false;
    });
  }
  // 加载 localStorage 中标记的已修改密码状态
  ADMIN_ACCOUNTS.forEach(acc => {
    if (localStorage.getItem('pwdChanged_' + acc.id)) {
      acc.mustChangePwd = false;
    }
  });
}

function autoSkipLogin() {
  // 先尝试从 sessionStorage 恢复登录状态
  const savedSession = sessionStorage.getItem('adminSession');
  if (savedSession) {
    try {
      const session = JSON.parse(savedSession);
      const account = ADMIN_ACCOUNTS.find(a => a.id === session.adminId);
      if (account && session.loginTime) {
        // 会话有效期：8小时
        const loginTime = new Date(session.loginTime).getTime();
        if (Date.now() - loginTime < 8 * 3600 * 1000) {
          currentAdmin = { id: account.id, name: account.name, role: account.role, permissions: account.permissions };
          adminSession = session;
          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('tokenPage').style.display = 'none';
          showAdminLayout();
          return;
        }
      }
    } catch(e) {}
    sessionStorage.removeItem('adminSession');
  }
  // 无有效会话，显示登录页
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('tokenPage').style.display = 'none';
  document.getElementById('adminLayout').classList.remove('active');
}

async function doAdminLogin() {
  const roleId = document.getElementById('loginRole').value;
  const pwd = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  err.style.display = 'none';
  if (!roleId) { err.textContent = '请选择身份'; err.style.display = 'block'; return; }
  if (!pwd) { err.textContent = '请输入密码'; err.style.display = 'block'; return; }

  const account = ADMIN_ACCOUNTS.find(a => a.id === roleId);
  if (!account) { err.textContent = '身份配置错误，请联系总维护人员'; err.style.display = 'block'; return; }

  // 检查登录锁定
  const lockKey = 'loginLock_' + roleId;
  const lockData = localStorage.getItem(lockKey);
  if (lockData) {
    try {
      const lock = JSON.parse(lockData);
      if (lock.lockedUntil && Date.now() < lock.lockedUntil) {
        const remain = Math.ceil((lock.lockedUntil - Date.now()) / 60000);
        err.textContent = '登录尝试次数过多，请 ' + remain + ' 分钟后再试';
        err.style.display = 'block';
        return;
      }
    } catch(e) { localStorage.removeItem(lockKey); }
  }

  btn.disabled = true; btn.textContent = '验证中...';

  // SHA-256 哈希对比
  const inputHash = await sha256(pwd);
  if (inputHash !== account.password) {
    // 记录失败次数
    const failKey = 'loginFail_' + roleId;
    let fails = parseInt(localStorage.getItem(failKey) || '0') + 1;
    localStorage.setItem(failKey, String(fails));
    if (fails >= 5) {
      const lockoutMinutes = 30;
      localStorage.setItem(lockKey, JSON.stringify({ lockedUntil: Date.now() + lockoutMinutes * 60000, failCount: fails }));
      localStorage.removeItem(failKey);
      err.textContent = '登录尝试次数过多，已锁定 ' + lockoutMinutes + ' 分钟';
    } else {
      err.textContent = '密码错误，还剩 ' + (5 - fails) + ' 次机会';
    }
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = '登录';
    return;
  }

  // 登录成功，清除失败记录
  localStorage.removeItem('loginFail_' + roleId);
  localStorage.removeItem(lockKey);

  // 登录成功
  currentAdmin = { id: account.id, name: account.name, role: account.role, permissions: account.permissions };
  adminSession = { adminId: currentAdmin.id, loginTime: new Date().toISOString() };
  sessionStorage.setItem('adminSession', JSON.stringify(adminSession));

  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('tokenPage').style.display = 'none';
  showAdminLayout();
  showToast('欢迎，' + account.name, 'success');

  // 首次登录强制提醒修改默认密码
  if (account.mustChangePwd && !localStorage.getItem('pwdChanged_' + roleId)) {
    setTimeout(() => {
      showToast('⚠️ 首次登录，请立即修改默认密码以确保安全', 'warning');
      navigateTo('settings');
    }, 800);
  }
}

  }

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

    const renderers = {
      dashboard: renderDashboard, config: renderConfig, announcements: renderAnnouncementsAdmin,

function generateCaseNo() {
  const year = new Date().getFullYear();
  const polls = appData.polls || [];
  const maxNum = polls.reduce((max, p) => {
    const match = p.caseNo && p.caseNo.match(/YJ-(\d+)/);
    return match ? Math.max(max, parseInt(match[1])) : max;
  }, 0);
  return year + '-YJ-' + String(maxNum + 1).padStart(3, '0');
}

async function saveItem(module, id) {
  const isNew = !id;
  let item = isNew ? { id: generateId(module) } : (appData[module] || []).find(x => x.id === id);
  if (!item) item = { id: id || generateId(module) };
  if (module === 'announcements') {
    item.title = document.getElementById('edTitle').value;
    item.category = document.getElementById('edCategory').value;
    item.publishDate = document.getElementById('edDate').value;
    item.author = document.getElementById('edAuthor').value;
    item.isPinned = document.getElementById('edPinned').checked;
    item.content = document.getElementById('edContent').value;
    item.views = item.views || 0;
    item.attachments = [];
    const uploadedPaths = getMultiUploadedPaths('annAttach');
    uploadedPaths.filter(path => !path.startsWith('blob:')).forEach(path => {
      item.attachments.push({ name: path.split('/').pop() || '附件', url: path });
    });
  } else if (module === 'documents') {
    item.title = document.getElementById('edTitle').value;
    item.source = document.getElementById('edSource').value;
    item.publishDate = document.getElementById('edDate').value;
    item.description = document.getElementById('edDesc').value;
    item.category = '上级文件';

    // 参照公告管理：使用 attachments 数组保存所有上传附件
    item.attachments = [];
    const uploadedPaths = getMultiUploadedPaths('docFile');
    uploadedPaths.filter(path => !path.startsWith('blob:')).forEach(path => {
      item.attachments.push({ 
        name: path.split('/').pop() || '附件', 
        url: path,
        type: /\.pdf$/i.test(path) ? 'pdf' : 'image'
      });
    });

    // 兼容旧字段：自动同步 fileUrl 和 images
    const pdfAttachments = item.attachments.filter(a => a.type === 'pdf');
    const imageAttachments = item.attachments.filter(a => a.type === 'image');

    // fileUrl：优先使用手动输入的值，否则取第一个PDF或第一个附件
    const manualFileUrl = document.getElementById('edFileUrl').value.trim();
    if (manualFileUrl) {
      item.fileUrl = manualFileUrl;
    } else if (pdfAttachments.length) {
      item.fileUrl = pdfAttachments[0].url;
    } else if (item.attachments.length) {
      item.fileUrl = item.attachments[0].url;
    } else {
      item.fileUrl = '';
    }

    // images：取所有图片附件
    item.images = imageAttachments.map(a => a.url);
  } else if (module === 'activities') {
    item.title = document.getElementById('edTitle').value;
    item.date = document.getElementById('edDate').value;
    item.location = document.getElementById('edLocation').value;
    item.status = document.getElementById('edStatus').value;
    const coverPath = getUploadedPath('actCover');
    if (coverPath) item.coverImage = coverPath;
    else item.coverImage = document.getElementById('edCoverImage').value.trim();
    const uploadedImages = getMultiUploadedPaths('actImages');
    let allImages = [...new Set(uploadedImages)].slice(0, 15);
    item.images = allImages;
    // 检测并过滤掉失效的 blob 链接
    item.images = item.images.filter(url => !url.startsWith('blob:'));
    const uploadedVideos = getMultiUploadedVideos('actVideos');
    item.videos = uploadedVideos.map(v => v.path).filter(url => !url.startsWith('blob:'));
    const vlinkText = document.getElementById('edVideoLinks').value.trim();
    item.videoLinks = vlinkText ? vlinkText.split(/\n/).map(s => s.trim()).filter(s => s) : [];
    item.videoUrl = item.videos[0] || '';  // 本地视频URL，不再混用外部链接
    const extText = document.getElementById('edExternalLinks').value.trim();
    item.externalLinks = extText ? extText.split(/\n/).map(s => s.trim()).filter(s => s) : [];
    item.externalLink = item.externalLinks[0] || '';  // 兼容旧字段
    item.content = document.getElementById('edContent').value;
  } else if (module === 'polls') {
    item.caseNo = document.getElementById('edCaseNo').value;
    item.title = document.getElementById('edTitle').value;
    item.startDate = document.getElementById('edStart').value;
    item.endDate = document.getElementById('edEnd').value;
    item.status = document.getElementById('edStatus').value;
    item.mode = document.getElementById('edPollMode').value;
    item.tencentUrl = document.getElementById('edTencent').value;
    item.progress = { target: parseInt(document.getElementById('edTarget').value)||0, current: parseInt(document.getElementById('edCurrent').value)||0, unit: '户' };
    item.results = { isPublished: document.getElementById('edPublishResult').checked, summary: document.getElementById('edResultSummary').value, detailUrl: '' };
    item.description = document.getElementById('edDesc').value;
    item.type = item.type || 'opinion';
    item.createdBy = item.createdBy || currentAdmin && currentAdmin.name;
    item.createdAt = item.createdAt || new Date().toISOString();
    if(item.mode === 'local') {
      item.questions = collectPollQuestions();
    } else {
      item.questions = [];
    }
  } else if (module === 'residents') {
    item.roomNo = document.getElementById('edRoom').value;
    item.name = document.getElementById('edName').value;
    item.phoneSuffix = document.getElementById('edPhone').value;
    item.status = document.getElementById('edStatus').value;
    item.isTest = document.getElementById('edTest').checked;
    item.registeredAt = item.registeredAt || new Date().toISOString().split('T')[0];
  }
  const list = appData[module] || [];
  const idx = list.findIndex(x => x.id === item.id);

async function saveDataFile(filename, data, detail, action) {
  action = action || 'update';

  // 优先使用 Worker 持久化（确保前端实时同步）
  const workerBase = getWorkerBase();
  if (workerBase) {
    try {
      await workerWrite('data/' + filename + '.json', data, detail);
      showToast('✅ 已同步到云端，前端将自动更新', 'success');
      await appendAuditLog(action, filename, (data && data.id) || '', detail);
      return;
    } catch(e) {
      console.error('Worker 保存失败，回退到本地:', e);
      showToast('⚠️ Worker 同步失败：' + e.message + '，已保存到本地', 'error');
      // 回退到 localStorage
    }
  }

  if (!githubToken) {
    localStorage.setItem('adminData_' + filename, JSON.stringify(data));
    showToast('保存成功', 'success');
    await appendAuditLog(action, filename, (data && data.id) || '', detail);
    return;
  }
  const ownerRepo = await getRepoInfo();
  if (!ownerRepo) throw new Error('无法获取仓库信息');
  const owner = ownerRepo[0], repo = ownerRepo[1];
  const path = 'data/' + filename + '.json';
  const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!getRes.ok) throw new Error('无法读取文件，请检查Token权限');
  const fileInfo = await getRes.json();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: '[' + (currentAdmin && currentAdmin.name || '') + '] ' + detail, content: content, sha: fileInfo.sha })
  });
  if (!putRes.ok) {
    const err = await putRes.json();
    throw new Error(err.message || '保存失败');
  }
  await appendAuditLog(action, filename, data.id || '', detail);
}

async function appendAuditLog(action, target, targetId, detail) {
  const log = appData['audit-log'] || [];
  log.push({
    id: 'log-' + Date.now(),
    timestamp: new Date().toISOString(),
    adminName: currentAdmin && currentAdmin.name || '未知',
    adminId: currentAdmin && currentAdmin.id || '',
    action: action,
    target: target,
    targetId: targetId,
    details: detail,
    clientInfo: navigator.userAgent
  });
  appData['audit-log'] = log;

  // 优先使用 Worker 保存审计日志
  const workerBase = getWorkerBase();
  if (workerBase) {
    try {
      await workerWrite('data/audit-log.json', log, '[' + (currentAdmin && currentAdmin.name || '') + '] 审计日志更新');
    } catch(e) { console.error('审计日志Worker保存失败', e); }
    return;
  }

  if (!githubToken) return;
  const ownerRepo = await getRepoInfo();
  if (!ownerRepo) return;

    const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
      headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
    });

    await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: '[' + (currentAdmin && currentAdmin.name || '') + '] 审计日志更新', content: content, sha: fileInfo.sha })
    });
  } catch(e) { console.error('审计日志保存失败', e); }
}

async function getRepoInfo() {
  if (!githubToken) return null;
  try {
    const r = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': 'token ' + githubToken }
    });
    if (!r.ok) return null;
    const user = await r.json();
    const savedRepo = localStorage.getItem('githubRepo');
    if (savedRepo) return [user.login, savedRepo];
    const path = window.location.pathname;
    const parts = path.split('/');
    if (parts.length >= 2 && parts[1] && !parts[1].includes('.')) return [user.login, parts[1]];
    return null;
  } catch(e) { return null; }
}

async function doBatchImport() {
  let rows = [];
  let success = 0, fail = 0;

  // 先尝试从上传的文件解析
  const batchPath = getUploadedPath('batchFile');
  if (batchPath && batchPath.startsWith('blob:')) {
    try {
      const r = await fetch(batchPath);
      if (r.ok) {
        const blob = await r.blob();
        const file = new File([blob], 'batch.csv');
        rows = await handleBatchFile(file);
      }
    } catch(e) { console.error(e); }
  } else if (batchPath) {
    showLoading(true);
    try {
      const ownerRepo = await getRepoInfo();
      if (ownerRepo) {
        const [owner, repo] = ownerRepo;
        const r = await fetch('https://raw.githubusercontent.com/' + owner + '/' + repo + '/main/' + batchPath);
        if (r.ok) {
          const blob = await r.blob();
          const file = new File([blob], 'batch.' + (batchPath.split('.').pop() || 'csv'));
          rows = await handleBatchFile(file);
        }
      }
    } catch(e) { console.error(e); }
    showLoading(false);
  }

  // 如果没有文件或文件解析失败，尝试文本框
  if (rows.length === 0) {
    const text = document.getElementById('batchData').value.trim();
    if (!text) { showToast('请输入数据或上传文件', 'error'); return; }
    const lines = text.split('\n');
    lines.forEach(line => {
      line = line.trim();
      if (!line) return;
      const parts = line.split(/[\t|\|\s]+/);
      if (parts.length >= 3) {
        rows.push(parts);
      }
    });
  }

  const newResidents = [];
  rows.forEach(parts => {
    const room = parts[0].trim();
    const name = parts[1].trim();
    const suffix = (parts[2] || '').trim().replace(/[^0-9]/g, '').substring(0,4);
    if (room && name && suffix) {
      newResidents.push({ id: 'r-' + Date.now() + '-' + Math.random().toString(36).substr(2,4), roomNo: room, name: name, phoneSuffix: suffix, status: 'active', isTest: false, registeredAt: new Date().toISOString().split('T')[0] });
      success++;
    } else { fail++; }
  });

  if (newResidents.length === 0) { showToast('未解析到有效数据', 'error'); return; }
  const list = appData.residents || [];
  list.push.apply(list, newResidents);
  appData.residents = list;
  closeModal(); showLoading(true);
  try {
    await saveDataFile('residents', list, '批量导入 ' + success + ' 位业主', 'batch-import');
    showToast('成功导入 ' + success + ' 位业主' + (fail?'，' + fail + '行失败':''), 'success');
    navigateTo('residents');
  } catch(e) {
    showToast('导入失败：' + e.message, 'error');
  } finally {
    showLoading(false);
  }
}

async function changePassword() {
  const oldPwd = document.getElementById('oldPassword').value;
  const newPwd = document.getElementById('newPassword').value;
  const confirmPwd = document.getElementById('confirmPassword').value;
  if (!oldPwd || !newPwd || !confirmPwd) { showToast('请填写所有字段', 'error'); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }
  if (newPwd.length < 6) { showToast('新密码需6位以上', 'error'); return; }

  const account = ADMIN_ACCOUNTS.find(a => a.id === (currentAdmin && currentAdmin.id));
  if (!account) { showToast('账户配置异常', 'error'); return; }
  const oldHash = await sha256(oldPwd);
  if (oldHash !== account.password) { showToast('当前密码错误', 'error'); return; }

  const newHash = await sha256(newPwd);

  // 更新内存中的密码
  account.password = newHash;

  // 同步持久化到 config.adminAccounts（如 Worker 可用）
  if (!appData.config) appData.config = {};
  if (!appData.config.adminAccounts) appData.config.adminAccounts = [];
  let persisted = appData.config.adminAccounts.find(a => a.id === account.id);
  if (persisted) {
    persisted.password = newHash;
  } else {
    appData.config.adminAccounts.push({ id: account.id, password: newHash, permissions: account.permissions });
  }

  showLoading(true);
  try {
    await saveDataFile('config', appData.config, '管理员 ' + account.name + ' 修改密码', 'password-change');
    // 标记密码已修改，不再强制提示
    localStorage.setItem('pwdChanged_' + account.id, '1');
    account.mustChangePwd = false;
    showToast('密码修改成功', 'success');
    document.getElementById('oldPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
  } catch(e) {
    showToast('密码已更新（内存），但持久化失败：' + e.message, 'warning');
  } finally {
    showLoading(false);
  }
}

/* ========== 图片压缩 ========== */

async function compressImageToBlob(file, maxSizeMB = 0.03) {
  if (!file.type.startsWith('image/')) return file;
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = async () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      let w = img.width, h = img.height;
      const maxDim = 800;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      const toBlob = (q) => new Promise((res) => {
        canvas.toBlob((b) => res(b), 'image/jpeg', q);
      });
      const maxSize = maxSizeMB * 1024 * 1024;
      let blob = await toBlob(0.25);
      if (blob.size <= maxSize) {
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
        return;
      }
      let low = 0.05, high = 0.4, bestBlob = null;
      while (high - low > 0.03) {
        const mid = (low + high) / 2;
        blob = await toBlob(mid);
        if (blob.size > maxSize) { high = mid; }
        else { low = mid; bestBlob = blob; }
      }
      if (bestBlob && bestBlob.size <= maxSize) {
        resolve(new File([bestBlob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
        return;
      }
      let scale = 0.7;
      while (scale > 0.05) {
        const nw = Math.max(1, Math.floor(w * scale));
        const nh = Math.max(1, Math.floor(h * scale));
        canvas.width = nw; canvas.height = nh;
        ctx.drawImage(img, 0, 0, nw, nh);
        blob = await toBlob(0.3);
        if (blob.size <= maxSize) {
          resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
          return;
        }
        scale -= 0.18;
      }
      reject(new Error('图片压缩后仍超过' + maxSizeMB + 'MB限制'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
    img.src = url;
  });
}

/* ========== 文件上传相关 ========== */

async function uploadFileToRepo(file, folder) {
  const maxSizeMB = folder === 'videos' ? 100 : (folder === 'images' ? 100 : (folder === 'files' ? 100 : 100));
  if (file.size > maxSizeMB * 1024 * 1024) {
    throw new Error('文件大小超过限制（' + maxSizeMB + 'MB）');
  }

  // ===== 优先使用 Worker 上传（确保前端可实时访问）=====
  const workerBase = getWorkerBase();
  if (workerBase) {
    try {
      const fd = new FormData();
      fd.append('file', file);
      console.log('[Worker Upload] 开始上传:', file.name, '大小:', (file.size/1024).toFixed(1), 'KB');
      const res = await fetch(workerBase + '/api/upload', { method: 'POST', body: fd });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error('Worker 返回 ' + res.status + ': ' + errText.substring(0,200));
      }
      const result = await res.json();
      if (result && result.url) {
        console.log('[Worker Upload] ✅ 成功:', result.url);
        return result.url;
      } else {
        throw new Error('Worker 返回数据异常: ' + JSON.stringify(result));
      }
    } catch (e) {
      console.error('[Worker Upload] ❌ 失败:', e.message);
      showToast('Worker 上传失败: ' + e.message + '，尝试 GitHub...', 'error');
      // 继续回退到 GitHub
    }
  }

  // ===== 回退到 GitHub API =====
  if (!githubToken) {
    // 如果连 GitHub 也没有，返回临时 blob（仅当前页可用，会提示用户）
    const blobUrl = URL.createObjectURL(file);
    console.warn('[Upload] ⚠️ 未配置 Worker 或 GitHub，返回临时 blob:', blobUrl);
    showToast('⚠️ 警告：未配置 Worker 或 GitHub，文件仅当前页可用，刷新后失效', 'error');
    return blobUrl;
  }
  const ownerRepo = await getRepoInfo();
  if (!ownerRepo) throw new Error('无法获取仓库信息，请检查Token');
  const [owner, repo] = ownerRepo;
  const ext = file.name.split('.').pop().toLowerCase();
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const filename = Date.now() + '_' + Math.random().toString(36).substr(2,6) + '_' + safeName;
  const path = 'assets/' + (folder || 'uploads') + '/' + filename;

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
          headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
        });
        let sha = '';
        if (getRes.ok) {
          const info = await getRes.json();
          sha = info.sha;
        }
        const body = {
          message: '[' + (currentAdmin && currentAdmin.name || 'admin') + '] 上传文件 ' + file.name,
          content: base64
        };
        if (sha) body.sha = sha;
        const putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
          method: 'PUT',
          headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!putRes.ok) {
          const err = await putRes.json();
          throw new Error(err.message || '上传失败');
        }
        resolve(path);
      } catch(e) {
        reject(e);
      }
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

function createFileUploaderHTML(options) {
  const { id, accept, hint, maxSizeText } = options;
  return `<div class="file-upload-wrap" id="wrap-${id}">
    <div class="file-dropzone" id="drop-${id}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleFileDrop(event,'${id}')" onclick="document.getElementById('inp-${id}').click()">
      <div>📎 点击或拖拽文件到此处上传</div>
      <div class="hint">${hint || ''}</div>
    </div>
    <input type="file" id="inp-${id}" style="display:none" accept="${accept || '*'}" onchange="handleFileSelect(event,'${id}')">
    <div class="file-preview" id="preview-${id}"></div>
    <div class="upload-progress" id="progress-${id}"></div>
  </div>`;
}

async function handleFileDrop(e, id) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const files = e.dataTransfer.files;
  if (files.length) await processFileUpload(files[0], id);
}

async function handleFileSelect(e, id) {
  const file = e.target.files[0];
  if (file) await processFileUpload(file, id);
}

async function processFileUpload(file, id) {
  const progressEl = document.getElementById('progress-' + id);
  const previewEl = document.getElementById('preview-' + id);
  const wrapEl = document.getElementById('wrap-' + id);

  let folder = 'uploads';
  let maxSize = 100 * 1024 * 1024;
  let isImage = false;
  if (id.includes('video')) { folder = 'videos'; maxSize = 800 * 1024 * 1024; }
  else if (id.includes('image') || id.includes('cover') || id.includes('logo') || id.includes('favicon')) { folder = 'images'; isImage = true; }
  else if (id.includes('pdf') || id.includes('file')) { folder = 'files'; maxSize = 100 * 1024 * 1024; }
  else if (id.includes('batch')) { folder = 'imports'; maxSize = 100 * 1024 * 1024; }

  let uploadFile = file;
  if (isImage && file.type.startsWith('image/')) {
    progressEl.textContent = '⏳ 压缩中...';
    try {
      uploadFile = await compressImageToBlob(file, 0.03);
      progressEl.textContent = '⏳ 上传中...';
    } catch(e) {
      showToast('图片压缩失败：' + e.message, 'error');
      return;
    }
  } else if (file.size > maxSize) {
    showToast('文件过大，限制' + (maxSize/1024/1024) + 'MB', 'error');
    return;
  }

  try {
    const path = await uploadFileToRepo(uploadFile, folder);
    progressEl.textContent = '✅ 上传成功';

    // 保存路径到data属性
    wrapEl.dataset.uploadedPath = path;
    wrapEl.dataset.fileName = file.name;

    // 显示预览
    let previewHTML = '';
    if (uploadFile.type.startsWith('image/')) {
      const url = URL.createObjectURL(uploadFile);
      previewHTML = `<div class="file-preview-item"><img src="${url}"><button class="remove" onclick="clearUpload('${id}')">×</button><div class="file-name">${uploadFile.name}</div></div>`;
    } else if (uploadFile.type.startsWith('video/')) {
      const url = URL.createObjectURL(uploadFile);
      previewHTML = `<div class="file-preview-item"><video src="${url}" muted playsinline webkit-playsinline x5-playsinline preload="metadata"></video><button class="remove" onclick="clearUpload('${id}')">×</button><div class="file-name">${uploadFile.name}</div></div>`;
    } else {
      previewHTML = `<div class="file-preview-item"><div class="file-icon">📄</div><button class="remove" onclick="clearUpload('${id}')">×</button><div class="file-name">${uploadFile.name}</div></div>`;
    }
    previewEl.innerHTML = previewHTML;
  } catch(e) {
    progressEl.textContent = '';
    showToast('上传失败：' + e.message, 'error');
  }
}

function clearUpload(id) {
  const wrapEl = document.getElementById('wrap-' + id);
  const previewEl = document.getElementById('preview-' + id);
  const progressEl = document.getElementById('progress-' + id);
  if (wrapEl) { delete wrapEl.dataset.uploadedPath; delete wrapEl.dataset.fileName; }
  if (previewEl) previewEl.innerHTML = '';
  if (progressEl) progressEl.textContent = '';
  const inp = document.getElementById('inp-' + id);
  if (inp) inp.value = '';
}

function getUploadedPath(id) {
  const wrapEl = document.getElementById('wrap-' + id);
  return wrapEl && wrapEl.dataset.uploadedPath || '';
}

function setUploadedPath(id, path, name) {
  const wrapEl = document.getElementById('wrap-' + id);
  const previewEl = document.getElementById('preview-' + id);
  if (!wrapEl) return;
  wrapEl.dataset.uploadedPath = path;
  wrapEl.dataset.fileName = name || path;
  if (previewEl && path) {
    const isImg = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(path);
    const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(path);

  const progressEl = document.getElementById('progress-' + id);
  const wrapEl = document.getElementById('wrap-' + id);
  let currentPaths = getMultiUploadedPaths(id);

  if (currentPaths.length + files.length > 15) {
    showToast('最多只能上传15个文件', 'error');
    files = files.slice(0, 15 - currentPaths.length);
  }

  if (files.length === 0) return;

  progressEl.textContent = '⏳ 处理中 ' + files.length + ' 个...';

  for (const file of files) {
    let uploadFile = file;
    let folder = 'files';
    let isImage = file.type.startsWith('image/');
    let isPdf = file.type === 'application/pdf';

    if (isImage) {
      folder = 'images';
      try {
        uploadFile = await compressImageToBlob(file, 0.03);
      } catch(e) {
        showToast('"' + file.name + '" 压缩失败：' + e.message, 'error');
        continue;
      }
    } else if (isPdf) {
      folder = 'files';
      if (file.size > 100 * 1024 * 1024) {
        showToast('"' + file.name + '" 超过100MB限制', 'error');
        continue;
      }
    } else {
      showToast('"' + file.name + '" 不支持的文件格式，仅支持图片和PDF', 'error');
      continue;
    }

    try {
      const path = await uploadFileToRepo(uploadFile, folder);
      currentPaths.push(path);
      renderMultiFilePreview(id, currentPaths);
      document.getElementById('count-' + id).textContent = currentPaths.length;
    } catch(e) {
      showToast('"' + file.name + '" 上传失败：' + e.message, 'error');
    }

  progressEl.textContent = currentPaths.length > 0 ? '✅ 已上传 ' + currentPaths.length + ' 个' : '';
  wrapEl.dataset.uploadedPaths = JSON.stringify(currentPaths);

async function compressVideo(file, targetMB) {
  return new Promise(async (resolve, reject) => {
    const targetSize = targetMB * 1024 * 1024;
    if (file.size <= targetSize) { resolve(file); return; }

    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';
    const url = URL.createObjectURL(file);
    let mediaRecorder = null;
    let recorderStarted = false;
    let cleanupDone = false;
    const chunks = [];

    const cleanup = (err) => {
      if (cleanupDone) return;
      cleanupDone = true;
      URL.revokeObjectURL(url);
      try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e) {}
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.stop(); } catch(e) {}
      }
      if (err) reject(err);
    };

    // 5分钟超时保护
    const timeout = setTimeout(() => {
      cleanup(new Error('视频压缩超时，请先用本地工具压缩后再上传'));
    }, 300000);

    video.onloadedmetadata = async () => {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // 计算合适的缩放比例，同时限制最大分辨率避免内存爆炸
        let scale = Math.min(1, Math.sqrt(targetSize / file.size) * 0.85);
        const maxDim = 1280;
        if (video.videoWidth * scale > maxDim) scale = maxDim / video.videoWidth;
        if (video.videoHeight * scale > maxDim) scale = maxDim / video.videoHeight;
        scale = Math.max(0.1, scale);

        canvas.width = Math.max(1, Math.floor(video.videoWidth * scale));
        canvas.height = Math.max(1, Math.floor(video.videoHeight * scale));

        // 先画一帧确保 canvas 有内容
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const stream = canvas.captureStream(30); // 30fps
        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' :
                         MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm';

        const duration = video.duration || 60;
        const bitRate = Math.min(4000000, Math.max(500000, Math.floor((targetSize * 8) / duration)));
        mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: bitRate });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          clearTimeout(timeout);
          URL.revokeObjectURL(url);
          try { video.pause(); } catch(e) {}
          const blob = new Blob(chunks, { type: 'video/webm' });
          if (blob.size === 0) {
            reject(new Error('压缩失败：输出为空，请手动压缩后上传'));
            return;
          }
          const compressed = new File([blob], file.name.replace(/\.[^.]+$/, '.webm'), { type: 'video/webm' });
          if (compressed.size > targetSize * 1.5) {
            reject(new Error('压缩后仍超过目标大小，请手动压缩后上传'));
          } else {
            resolve(compressed);
          }
        };

        mediaRecorder.onerror = () => {
          clearTimeout(timeout);
          cleanup(new Error('视频录制失败，请手动压缩后上传'));
        };

        mediaRecorder.start(1000);
        recorderStarted = true;

        // 等待视频开始播放后再绘制
        await video.play();

        const drawFrame = () => {
          if (video.ended) {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            return;
          }
          if (video.paused) {
            // 如果意外暂停，尝试恢复
            video.play().catch(() => {});
          }
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          requestAnimationFrame(drawFrame);
        };
        requestAnimationFrame(drawFrame);

      } catch(e) {
        clearTimeout(timeout);
        cleanup(new Error('压缩初始化失败：' + (e.message || '未知错误')));
      }
    };

    video.onerror = () => {
      clearTimeout(timeout);
      cleanup(new Error('视频加载失败，格式可能不受支持'));
    };

    video.src = url;
  });
}

/* ========== Excel / VCF 解析 ========== */

function parseExcelSimple(arrayBuffer) {
  const data = new Uint8Array(arrayBuffer);
  let csv = '';
  const len = data.length;
  let i = 0;
  // 简单解析：寻找PK头（xlsx）或纯文本（csv/xls）
  // 这里做一个简化版：如果是CSV直接解析，如果是xlsx做简单文本提取
  const text = new TextDecoder('utf-8').decode(data);
  if (text.includes('\t') || text.includes(',')) {
    return text.split('\n').map(line => line.split(/[\t,]/).map(s => s.trim())).filter(r => r.length >= 3 && r[0]);
  }
  // 对于真正的xlsx，这里简化处理：尝试提取所有文本中的数字和中文行
  const lines = text.replace(/[^\x20-\x7E\u4e00-\u9fa5\n\t]/g, '\n').split('\n').filter(l => l.trim());
  const results = [];
  for (const line of lines) {
    const parts = line.split(/[\t,|\s]+/).filter(s => s.trim());
    if (parts.length >= 3 && /^[\d-]+$/.test(parts[0])) results.push(parts);
  }
  return results;
}

function parseVCF(vcfText) {
  const lines = vcfText.split('\n');
  const contacts = [];
  let current = null;
  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.startsWith('BEGIN:VCARD')) current = { name: '', phone: '', room: '' };
    else if (trimmed.startsWith('END:VCARD')) {
      if (current && current.name) contacts.push(current);
      current = null;
    } else if (current && trimmed.startsWith('FN:')) {
      current.name = trimmed.substring(3);
    } else if (current && trimmed.startsWith('TEL')) {
      const idx = trimmed.indexOf(':');
      if (idx > 0) current.phone = trimmed.substring(idx + 1).replace(/\D/g, '');
    } else if (current && trimmed.startsWith('ADR') || trimmed.startsWith('NOTE')) {
      const idx = trimmed.indexOf(':');
      if (idx > 0) {
        const val = trimmed.substring(idx + 1);
        const match = val.match(/([\d]+-[\d]+-[\d]+)/);
        if (match) current.room = match[1];
      }
    }
  }
  return contacts;
}

async function handleBatchFile(file) {
  const name = file.name.toLowerCase();
  let rows = [];
  if (name.endsWith('.vcf') || name.endsWith('.vcd')) {
    const text = await file.text();
    const contacts = parseVCF(text);
    rows = contacts.map(c => [c.room || '', c.name, c.phone.slice(-4)]).filter(r => r[1]);
  } else if (name.endsWith('.csv') || name.endsWith('.txt')) {
    const text = await file.text();
    rows = text.split('\n').map(line => line.split(/[\t,|]/).map(s => s.trim())).filter(r => r.length >= 3 && r[0]);
  } else if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    const buf = await file.arrayBuffer();
    rows = parseExcelSimple(buf);
  } else {
    showToast('不支持的文件格式，请使用 .csv / .xlsx / .vcf', 'error');
    return [];
  }
  return rows;
}

function generateId(module) {
  const prefix = { announcements: 'ann', documents: 'doc', activities: 'act', polls: 'poll', residents: 'r' };
  const list = appData[module] || [];
  const maxNum = list.reduce((max, item) => {
    const match = item.id && item.id.match(/\d+/);
    return match ? Math.max(max, parseInt(match[0])) : max;
  }, 0);
  return (prefix[module] || 'item') + '-' + String(maxNum + 1).padStart(3, '0');
}

function getModuleName(module) {
  const names = { announcements: '公告', documents: '文件', activities: '动态', polls: '投票', residents: '业主', config: '配置' };
  return names[module] || module;
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function refreshWorkorders(){
  showLoading(true);
  try{
    appData.workorders = await loadAllWorkorders();
    // 5-year retention: filter out completed non-test workorders older than 5 years from display
    const now = new Date();
    const fiveYearsAgo = new Date(now.getFullYear()-5, now.getMonth(), now.getDate());
    appData.workorders = (appData.workorders || []).filter(item => {
      if(!item) return false;
      // Keep all non-completed, all test data, and completed within 5 years
      if(item.status !== '已完成') return true;
      if(item.isTest) return true;
      const created = item.createdAt ? new Date(item.createdAt) : new Date();
      return created >= fiveYearsAgo;
    });
    renderWorkordersContent();
  }catch(e){ showToast('加载失败：'+e.message, 'error'); }
  finally{ showLoading(false); }
}

async function saveWorkorderAction(id){
  const list = appData.workorders || [];
  const checkItem = list.find(x=>x.id===id);
  if(checkItem && checkItem.status === '已完成' && !checkItem.isTest){
    showToast('该工单已完成并锁定，不可修改', 'error');
    return;
  }
  const status = document.getElementById('woNewStatus').value;
  const assignee = document.getElementById('woAssignee').value.trim();
  const workerPhone = document.getElementById('woWorkerPhone').value.trim();
  const reply = document.getElementById('woReply').value.trim();
  showLoading(true);
  try{
    // 优先从内存中获取记录，避免跨月份或数据不同步导致找不到
    let woList = appData.workorders || [];
    let item = woList.find(x=>x.id===id);

    // 如果内存中没有，尝试从当前月份文件读取（兼容旧逻辑）
    if(!item){
      const path = getCurrentMonthPath('workorders');
      woList = await workerRead(path);
      item = woList.find(x=>x.id===id);
    }

    if(!item) throw new Error('工单不存在或已过期，请刷新页面后重试');
    if(item.status === '已完成' && !item.isTest){
      throw new Error('该工单已完成并锁定，不可修改');
    }
    const oldStatus = item.status;
    item.status = status;
    item.assignedTo = assignee;
    item.workerPhone = workerPhone;
    if(reply){
      item.timeline = item.timeline || [];
      item.timeline.push({time:new Date().toISOString(), action:reply, operator:(currentAdmin&&currentAdmin.name)||'管理员', status: status});
    }
    if(assignee && oldStatus==='待受理' && status==='待受理') item.status='已派单';
    if(reply && (status==='已派单'||status==='处理中')) item.status='处理中';
    if(status==='已完成' && (item.rating===undefined || item.rating===null)) item.status='待评价';
    item.updatedAt = new Date().toISOString();
    for(const f of _woAdminImages){
      const r = await workerUpload(f);
      item.adminImages = item.adminImages || [];
      item.adminImages.push(r.url || r);
    }
    _woAdminImages = [];
    const path = getCurrentMonthPath('workorders');
    await workerWrite(path, woList, '管理员处理工单 '+id);
    appData.workorders = woList;
    closeModal();
    showToast('处理成功', 'success');
    navigateTo('workorders');
  }catch(e){ showToast('处理失败：'+e.message, 'error'); }
  finally{ showLoading(false); }
}

async function handleCPReplyImages(input){
  const files = Array.from(input.files);
  const preview = document.getElementById('cpReplyImagesPreview');
  const countEl = document.getElementById('cpReplyImgCount');
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    let file = f;
    try{ file = await compressImageToBlob(f, 0.03); }
    catch(e){ showToast('"'+f.name+'" 压缩失败：'+e.message, 'error'); continue; }
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.style.cssText = 'position:relative;width:60px;height:60px;border-radius:4px;overflow:hidden;border:1px solid var(--border);';
    div.dataset.fname = file.name;
    div.innerHTML = '<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;"><button type="button" onclick="removeCPReplyImage(this)" style="position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;">×</button>';
    preview.appendChild(div);
    _cpReplyImages.push(file);
  }
  if(countEl) countEl.textContent = _cpReplyImages.length;
  input.value = '';
}
function removeCPReplyImage(btn){
  const div = btn.parentElement;
  const fname = div.dataset.fname;
  _cpReplyImages = _cpReplyImages.filter(f => f.name !== fname);
  div.remove();
  const countEl = document.getElementById('cpReplyImgCount');
  if(countEl) countEl.textContent = _cpReplyImages.length;
}

  showLoading(true);
  try{
    // 优先从内存中获取记录，避免跨月份或数据不同步导致找不到
    let cpList = appData.complaints || [];
    let item = cpList.find(x=>x.id===id);

    // 如果内存中没有，尝试从当前月份文件读取（兼容旧逻辑）
    if(!item){
      const path = getCurrentMonthPath('complaints');
      cpList = await workerRead(path);
      item = cpList.find(x=>x.id===id);
    }

    if(!item) throw new Error('记录不存在或已过期，请刷新页面后重试');
    if(reply){ item.reply = reply; item.replyAt = new Date().toISOString(); }
    item.status = action==='close' ? '已办结' : '已回复';
    item.handler = currentAdmin && currentAdmin.name || '管理员';
    item.updatedAt = new Date().toISOString();
    item.timeline = item.timeline || [];
    item.timeline.push({time:new Date().toISOString(), action: action==='close'?'直接办结':('回复：'+reply), operator: item.handler, status: item.status});
    // 上传回复图片（不限制数量，逐个上传，高强度压缩）
    item.replyImages = item.replyImages || [];
    for(const f of _cpReplyImages){
      try{
        const r = await workerUpload(f);
        item.replyImages.push(r.url || r);
      }catch(e){
        showToast('图片上传失败：'+e.message, 'error');
      }
    }
    _cpReplyImages = [];
    const path = getCurrentMonthPath('complaints');
    await workerWrite(path, cpList, '管理员处理反馈 '+id);
    appData.complaints = cpList;
    closeModal();
    showToast('处理成功', 'success');
    navigateTo('complaints');
  }catch(e){ showToast('处理失败：'+e.message, 'error'); }
  finally{ showLoading(false); }
}

/* ========== 本地问卷后台管理功能 ========== */

function onPollModeChange() {
  const mode = document.getElementById('edPollMode').value;
  const tencentSec = document.getElementById('tencentSection');
  const localSec = document.getElementById('localSection');
  if(tencentSec) tencentSec.style.display = mode === 'tencent' ? 'block' : 'none';
  if(localSec) localSec.style.display = mode === 'local' ? 'block' : 'none';
}

let _pollQuestions = [];

function renderPollQuestionsEditor(questions) {
  _pollQuestions = JSON.parse(JSON.stringify(questions || []));
  const container = document.getElementById('pollQuestionsEditor');
  if(!container) return;
  if(!_pollQuestions.length) {
    container.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;padding:8px 0;">暂无题目，请点击下方按钮添加</div>';
    return;
  }
  let html = '';
  _pollQuestions.forEach((q, idx) => {
    html += '<div class="poll-q-item" style="background:#fff;border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">';
    html += '<div style="display:flex;gap:8px;margin-bottom:8px;">';
    html += '<span style="font-weight:600;font-size:13px;">题目 ' + (idx+1) + '</span>';
    html += '<button type="button" class="btn btn-sm btn-danger" onclick="removePollQuestion(' + idx + ')" style="margin-left:auto;">删除</button>';
    html += '</div>';
    html += '<div class="form-group" style="margin-bottom:10px;"><label style="font-size:12px;">题目标题</label><input type="text" id="qTitle-' + idx + '" value="' + escapeHtml(q.title||'') + '" placeholder="请输入题目标题"></div>';
    html += '<div class="form-row" style="grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:10px;">';
    html += '<div class="form-group" style="margin-bottom:0;"><label style="font-size:12px;">类型</label><select id="qType-' + idx + '" onchange="onQuestionTypeChange(' + idx + ')"><option value="single" ' + (q.type==='single'?'selected':'') + '>单选</option><option value="multiple" ' + (q.type==='multiple'?'selected':'') + '>多选</option><option value="text" ' + (q.type==='text'?'selected':'') + '>文本</option></select></div>';
    html += '<div class="form-group form-check" style="margin-bottom:0;align-self:flex-end;padding-bottom:8px;"><input type="checkbox" id="qReq-' + idx + '" ' + (q.required?'checked':'') + '><label for="qReq-' + idx + '">必填</label></div>';
    html += '</div>';
    html += '<div id="qOptionsWrap-' + idx + '" style="' + (q.type==='text'?'display:none;':'') + '">';
    html += '<label style="font-size:12px;display:block;margin-bottom:6px;">选项（每行一个）</label>';
    html += '<textarea id="qOpts-' + idx + '" rows="3" placeholder="选项1&#10;选项2&#10;选项3" style="font-family:inherit;">' + escapeHtml((q.options||[]).join('\n')) + '</textarea>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function onQuestionTypeChange(idx) {
  const type = document.getElementById('qType-' + idx).value;
  const wrap = document.getElementById('qOptionsWrap-' + idx);
  if(wrap) wrap.style.display = type === 'text' ? 'none' : 'block';
}

function addPollQuestion() {
  _pollQuestions.push({ id: 'q-' + Date.now() + '-' + Math.random().toString(36).substr(2,4), title: '', type: 'single', options: ['选项1','选项2'], required: true });
  renderPollQuestionsEditor(_pollQuestions);
}

function removePollQuestion(idx) {
  _pollQuestions.splice(idx, 1);
  renderPollQuestionsEditor(_pollQuestions);
}

function collectPollQuestions() {
  const questions = [];
  _pollQuestions.forEach((q, idx) => {
    const title = document.getElementById('qTitle-' + idx).value.trim();
    if(!title) return;
    const type = document.getElementById('qType-' + idx).value;
    const required = document.getElementById('qReq-' + idx).checked;
    let options = [];
    if(type !== 'text') {
      const optsText = document.getElementById('qOpts-' + idx).value;
      options = optsText.split('\n').map(s => s.trim()).filter(s => s);
    }
    questions.push({ id: q.id || ('q-' + Date.now() + '-' + idx), title, type, options, required });
  });
  return questions;
}

async function viewPollData(pollId) {
  const p = (appData.polls||[]).find(x => x.id === pollId);
  if(!p) return;
  showLoading(true);
  let responses = [];
  try {
    const d = new Date();
    const path = 'polls-responses/' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '.json';
    responses = await workerRead(path);
    responses = responses.filter(x => x.pollId === pollId);
  } catch(e) { responses = []; }
  showLoading(false);

  document.getElementById('modalTitle').textContent = '📊 问卷数据：' + p.title;
  let body = '<div style="margin-bottom:12px;"><span style="font-size:13px;color:var(--text-secondary);">共 ' + responses.length + ' 人参与</span>';
  body += '<button class="btn btn-sm" onclick="downloadPollData(\'' + pollId + '\')" style="margin-left:12px;">📥 下载CSV</button></div>';

  if(!responses.length) {
    body += '<div class="empty-state"><div class="icon">📊</div><div>暂无数据</div></div>';
  } else {
    body += '<div style="overflow-x:auto;"><table class="data-table"><thead><tr><th>房号</th><th>姓名</th><th>提交时间</th>';
    (p.questions||[]).forEach(q => {
      body += '<th>' + escapeHtml(q.title) + '</th>';
    });
    body += '</tr></thead><tbody>';
    responses.forEach(r => {
      body += '<tr><td>' + (r.residentRoom||'') + '</td><td>' + (r.residentName||'') + '</td><td>' + formatDateTime(r.createdAt) + '</td>';
      (p.questions||[]).forEach(q => {
        const ans = r.answers.find(a => a.questionId === q.id);
        let val = '';
        if(ans) {
          if(Array.isArray(ans.value)) val = ans.value.join(', ');
          else val = ans.value;
        }
        body += '<td>' + escapeHtml(val) + '</td>';
      });
      body += '</tr>';
    });
    body += '</tbody></table></div>';

    body += '<div style="margin-top:20px;"><div style="font-weight:600;margin-bottom:12px;">📈 选项统计</div>';
    (p.questions||[]).forEach(q => {
      if(q.type === 'text') return;
      body += '<div style="background:#fafafa;border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;">';
      body += '<div style="font-weight:600;margin-bottom:8px;">' + escapeHtml(q.title) + '</div>';
      const counts = {};
      (q.options||[]).forEach(opt => counts[opt] = 0);
      responses.forEach(r => {
        const ans = r.answers.find(a => a.questionId === q.id);
        if(!ans || !ans.value) return;
        if(Array.isArray(ans.value)) {
          ans.value.forEach(v => { if(counts[v] !== undefined) counts[v]++; });
        } else {
          if(counts[ans.value] !== undefined) counts[ans.value]++;
        }
      });
      const total = responses.length || 1;
      (q.options||[]).forEach(opt => {
        const c = counts[opt] || 0;
        const pct = Math.round(c / total * 100);
        body += '<div style="margin-bottom:6px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;"><span>' + escapeHtml(opt) + '</span><span>' + c + ' (' + pct + '%)</span></div>';
        body += '<div style="background:#e0e0e0;border-radius:4px;height:16px;overflow:hidden;"><div style="height:100%;background:var(--primary);width:' + pct + '%;"></div></div></div>';
      });
      body += '</div>';
    });
    body += '</div>';
  }

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = '<button class="btn" onclick="closeModal()">关闭</button>';
  document.getElementById('modalOverlay').classList.add('active');
}

async function downloadPollData(pollId) {
  const p = (appData.polls||[]).find(x => x.id === pollId);
  if(!p) return;
  showLoading(true);
  let responses = [];
  try {
    const d = new Date();
    const path = 'polls-responses/' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '.json';
    responses = await workerRead(path);
    responses = responses.filter(x => x.pollId === pollId);
  } catch(e) { responses = []; }
  showLoading(false);

  let csv = '\uFEFF';
  csv += '房号,姓名,提交时间';
  (p.questions||[]).forEach(q => {
    csv += ',"' + (q.title||'').replace(/"/g, '""') + '"';
  });
  csv += '\n';

  responses.forEach(r => {
    csv += (r.residentRoom||'') + ',' + (r.residentName||'') + ',"' + (r.createdAt||'') + '"';
    (p.questions||[]).forEach(q => {
      const ans = r.answers.find(a => a.questionId === q.id);
      let val = '';
      if(ans) {
        if(Array.isArray(ans.value)) val = ans.value.join(', ');
        else val = ans.value;
      }
      csv += ',"' + val.replace(/"/g, '""') + '"';
    });
    csv += '\n';
  });

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '问卷数据_' + (p.caseNo||pollId) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function previewImage(url){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;transition:opacity .2s;';
  ov.innerHTML = '<img src="'+url+'" style="max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.4);transform:scale(0.95);transition:transform .2s;">';
  document.body.appendChild(ov);
  requestAnimationFrame(()=>{ ov.style.opacity='1'; ov.querySelector('img').style.transform='scale(1)'; });
  ov.onclick = ()=>{ ov.style.opacity='0'; ov.querySelector('img').style.transform='scale(0.95)'; setTimeout(()=>ov.remove(),200); };
}
