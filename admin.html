<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 春天阳光小区</title>
<style>
:root {
  --primary: #2E8B57; --primary-light: #3da76b; --primary-dark: #1f6b41;
  --bg: #f0f2f5; --card: #fff; --text: #333; --text-secondary: #666;
  --border: #e0e0e0; --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 8px; --sidebar-w: 220px; --header-h: 56px;
  --danger: #c62828; --warning: #f9a825; --success: #2e7d32;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }

.login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); }
.login-box { background:#fff; border-radius:16px; padding:40px; width:90%; max-width:420px; box-shadow:0 12px 40px rgba(0,0,0,0.2); }
.login-box h2 { text-align:center; margin-bottom:8px; font-size:22px; }
.login-box .subtitle { text-align:center; color:var(--text-secondary); font-size:14px; margin-bottom:24px; }
.login-box input { width:100%; padding:12px 14px; margin-bottom:12px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
.login-box button { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; font-weight:500; }
.login-box button:hover { background:var(--primary-dark); }
.login-box button:disabled { background:#ccc; cursor:not-allowed; }
.login-box .error { color:var(--danger); font-size:13px; text-align:center; margin-bottom:12px; display:none; }
.login-box .tip { font-size:12px; color:var(--text-secondary); text-align:center; margin-top:12px; }

.admin-layout { display:none; min-height:100vh; }
.admin-layout.active { display:flex; }

.sidebar { width:var(--sidebar-w); background:#fff; border-right:1px solid var(--border); position:fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index:100; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.sidebar-header .logo { width:36px; height:36px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; }
.sidebar-header .title { font-size:15px; font-weight:600; }
.sidebar-header .role { font-size:11px; color:var(--text-secondary); }
.sidebar-nav { padding:8px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; cursor:pointer; font-size:14px; color:var(--text); transition:.15s; margin-bottom:2px; }
.nav-item:hover { background:#f5f5f5; }
.nav-item.active { background:var(--primary); color:#fff; }
.nav-item .icon { font-size:18px; width:24px; text-align:center; }
.sidebar-footer { padding:16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-secondary); }
.sidebar-footer button { width:100%; padding:8px; background:#f5f5f5; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:13px; margin-top:8px; }

.main-content { flex:1; margin-left:var(--sidebar-w); min-height:100vh; }
.topbar { height:var(--header-h); background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:50; }
.topbar h1 { font-size:18px; font-weight:600; }
.topbar-actions { display:flex; gap:8px; }
.topbar-actions button { padding:6px 14px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
.topbar-actions button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }

.content-area { padding:24px; max-width:1200px; }

.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px; }
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.card-header h3 { font-size:16px; font-weight:600; }
.card-header .actions { display:flex; gap:8px; }

.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
.stat-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
.stat-card .label { font-size:13px; color:var(--text-secondary); margin-bottom:8px; }
.stat-card .value { font-size:28px; font-weight:700; color:var(--primary); }

.data-table { width:100%; border-collapse:collapse; font-size:14px; }
.data-table th { text-align:left; padding:12px; border-bottom:2px solid var(--border); font-weight:600; color:var(--text-secondary); font-size:13px; }
.data-table td { padding:12px; border-bottom:1px solid var(--border); }
.data-table tr:hover td { background:#fafafa; }
.data-table .actions { display:flex; gap:6px; }
.data-table .actions button { padding:4px 10px; border:1px solid var(--border); background:#fff; border-radius:4px; cursor:pointer; font-size:12px; }
.data-table .actions button.danger { color:var(--danger); border-color:var(--danger); }
.data-table .actions button:hover { background:#f5f5f5; }

.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:inherit; }
.form-group textarea { min-height:120px; resize:vertical; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary); }
.form-row { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.form-check { display:flex; align-items:center; gap:8px; }
.form-check input { width:auto; }

.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:6px; font-size:14px; cursor:pointer; border:1px solid var(--border); background:#fff; }
.btn:hover { background:#f5f5f5; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-dark); }
.btn-danger { color:var(--danger); border-color:var(--danger); }
.btn-danger:hover { background:#ffebee; }
.btn-sm { padding:6px 12px; font-size:13px; }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal-box { background:#fff; border-radius:12px; width:90%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.2); }
.modal-box .modal-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-box .modal-header h3 { font-size:18px; }
.modal-box .modal-header .close { font-size:24px; cursor:pointer; color:var(--text-secondary); }
.modal-box .modal-body { padding:20px; }
.modal-box .modal-footer { padding:16px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

.toast-container { position:fixed; top:20px; right:20px; z-index:2000; display:flex; flex-direction:column; gap:8px; }
.toast { background:#fff; border-radius:8px; padding:12px 16px; box-shadow:0 4px 16px rgba(0,0,0,0.15); display:flex; align-items:center; gap:10px; min-width:280px; animation:slideIn .3s ease; }
.toast.success { border-left:4px solid var(--success); }
.toast.error { border-left:4px solid var(--danger); }
.toast.info { border-left:4px solid var(--primary); }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

.progress-bar { background:#e0e0e0; border-radius:6px; height:8px; overflow:hidden; }
.progress-bar-fill { height:100%; background:var(--primary); border-radius:6px; }

.tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.tag-test { background:#fff3e0; color:#e65100; }
.tag-active { background:#e8f5e9; color:#2e7d32; }
.tag-disabled { background:#eceff1; color:#546e7a; }

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); transition:.3s; }
  .sidebar.open { transform:translateX(0); }
  .main-content { margin-left:0; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .form-row { grid-template-columns:1fr; }
}

.loading-overlay { position:fixed; inset:0; background:rgba(255,255,255,0.8); z-index:3000; display:none; align-items:center; justify-content:center; }
.loading-overlay.active { display:flex; }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.empty-state { text-align:center; padding:60px 20px; color:var(--text-secondary); }
.empty-state .icon { font-size:48px; margin-bottom:16px; }

.batch-textarea { width:100%; min-height:200px; padding:12px; border:1px solid var(--border); border-radius:6px; font-family:monospace; font-size:13px; }
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-box">
    <h2>🔐 管理员登录</h2>
    <p class="subtitle">春天阳光小区 · 管理后台</p>
    <div class="error" id="loginError"></div>
    <input type="password" id="loginPassword" placeholder="请输入管理密码">
    <button id="loginBtn" onclick="doAdminLogin()">登录</button>
    <p class="tip">默认密码：Sunlight2026<br>首次登录后请立即修改密码</p>
  </div>
</div>

<div class="login-page" id="tokenPage" style="display:none;">
  <div class="login-box">
    <h2>🔑 配置 GitHub Token</h2>
    <p class="subtitle">需要 GitHub Personal Access Token 才能保存数据</p>
    <div class="error" id="tokenError"></div>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
    <input type="text" id="adminName" placeholder="管理员名称（用于审计日志）">
    <button onclick="saveToken()">保存并进入后台</button>
    <p class="tip">Token 类型：classic，需勾选 repo 权限<br>Token 仅保存在本浏览器，不会上传</p>
  </div>
</div>

<div class="admin-layout" id="adminLayout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">⚙️</div>
      <div>
        <div class="title">管理后台</div>
        <div class="role" id="adminRole">超级管理员</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div id="adminInfo">管理员A</div>
      <button onclick="logout()">退出登录</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <h1 id="pageTitle">仪表盘</h1>
      <div class="topbar-actions">
        <button onclick="window.open('index.html','_blank')">🌐 查看前台</button>
        <button class="primary" id="saveBtn" onclick="saveCurrentModule()" style="display:none;">💾 保存</button>
      </div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <span class="close" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
let appData = {};
let currentModule = 'dashboard';
let adminSession = null;
let githubToken = localStorage.getItem('githubToken') || '';
let currentAdmin = null;
const SALT = "SunlightCommunity2026";

document.addEventListener('DOMContentLoaded', async () => {
  await loadAllData();
  checkLoginState();
});

async function loadAllData() {
  const files = ['config','announcements','documents','activities','polls','residents','audit-log'];
  for (const f of files) {
    try {
      const r = await fetch('data/' + f + '.json?t=' + Date.now());
      appData[f] = await r.json();
    } catch(e) { appData[f] = []; }
  }
}

function checkLoginState() {
  const session = localStorage.getItem('adminSession');
  if (session) {
    try {
      adminSession = JSON.parse(session);
      const admin = (appData.config && appData.config.admins || []).find(a => a.id === adminSession.adminId);
      if (admin && githubToken) {
        currentAdmin = admin;
        showAdminLayout();
        return;
      }
    } catch(e) {}
  }
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('tokenPage').style.display = 'none';
  document.getElementById('adminLayout').classList.remove('active');
}

async function doAdminLogin() {
  const pwd = document.getElementById('loginPassword').value.trim();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if (!pwd) { err.textContent = '请输入密码'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '验证中...';
  const hash = await sha256(pwd + SALT);
  const storedHash = appData.config && appData.config.auth && appData.config.auth.passwordHash;
  if (hash !== storedHash) {
    err.textContent = '密码错误'; err.style.display = 'block';
    btn.disabled = false; btn.textContent = '登录';
    return;
  }
  document.getElementById('loginPage').style.display = 'none';
  if (!githubToken) {
    document.getElementById('tokenPage').style.display = 'flex';
  } else {
    showAdminLayout();
  }
}

async function saveToken() {
  const token = document.getElementById('githubToken').value.trim();
  const name = document.getElementById('adminName').value.trim();
  const err = document.getElementById('tokenError');
  if (!token) { err.textContent = '请输入Token'; err.style.display = 'block'; return; }
  if (!name) { err.textContent = '请输入管理员名称'; err.style.display = 'block'; return; }
  showLoading(true);
  try {
    const r = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!r.ok) throw new Error('Token验证失败');
    githubToken = token;
    localStorage.setItem('githubToken', token);
    const admins = appData.config && appData.config.admins || [];
    let admin = admins.find(a => a.name === name);
    if (!admin) admin = admins[0];
    currentAdmin = admin;
    adminSession = { adminId: admin.id, loginTime: new Date().toISOString() };
    localStorage.setItem('adminSession', JSON.stringify(adminSession));
    showLoading(false);
    document.getElementById('tokenPage').style.display = 'none';
    showAdminLayout();
    showToast('登录成功', 'success');
  } catch(e) {
    showLoading(false);
    err.textContent = 'Token验证失败：' + e.message;
    err.style.display = 'block';
  }
}

function showAdminLayout() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('tokenPage').style.display = 'none';
  document.getElementById('adminLayout').classList.add('active');
  document.getElementById('adminInfo').textContent = currentAdmin && currentAdmin.name || '管理员';
  document.getElementById('adminRole').textContent = currentAdmin && currentAdmin.role === 'super' ? '超级管理员' : (currentAdmin && currentAdmin.role === 'editor' ? '编辑员' : '查看员');
  renderSidebar();
  navigateTo('dashboard');
}

function logout() {
  if (confirm('确定要退出登录吗？')) {
    localStorage.removeItem('adminSession');
    localStorage.removeItem('githubToken');
    adminSession = null; currentAdmin = null; githubToken = '';
    location.reload();
  }
}

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function renderSidebar() {
  const perms = currentAdmin && currentAdmin.permissions || [];
  const isSuper = currentAdmin && currentAdmin.role === 'super';
  const isViewer = currentAdmin && currentAdmin.role === 'viewer';
  const items = [
    { id: 'dashboard', label: '仪表盘', icon: '📊', perm: 'view' },
    { id: 'config', label: '社区配置', icon: '⚙️', perm: 'all', super: true },
    { id: 'announcements', label: '公告管理', icon: '📢', perm: 'announcements' },
    { id: 'documents', label: '文件管理', icon: '📄', perm: 'documents' },
    { id: 'activities', label: '动态管理', icon: '🎉', perm: 'activities' },
    { id: 'polls', label: '投票管理', icon: '🗳️', perm: 'polls' },
    { id: 'residents', label: '业主管理', icon: '👥', perm: 'residents' },
    { id: 'audit', label: '操作日志', icon: '📋', perm: 'audit-log' },
    { id: 'settings', label: '系统设置', icon: '🔐', perm: 'all', super: true }
  ];
  let html = '';
  items.forEach(item => {
    const hasPerm = isSuper || isViewer || perms.indexOf(item.perm) >= 0 || perms.indexOf('all') >= 0;
    if (!hasPerm) return;
    if (item.super && !isSuper) return;
    html += '<div class="nav-item ' + (item.id==='dashboard'?'active':'') + '" data-module="' + item.id + '" onclick="navigateTo(\'' + item.id + '\')">';
    html += '<span class="icon">' + item.icon + '</span><span>' + item.label + '</span></div>';
  });
  document.getElementById('sidebarNav').innerHTML = html;
}

function navigateTo(module) {
  currentModule = module;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.module === module));
  const titles = { dashboard: '仪表盘', config: '社区配置', announcements: '公告管理', documents: '文件管理', activities: '动态管理', polls: '投票管理', residents: '业主管理', audit: '操作日志', settings: '系统设置' };
  document.getElementById('pageTitle').textContent = titles[module] || module;
  document.getElementById('saveBtn').style.display = ['dashboard','audit'].indexOf(module) >= 0 ? 'none' : 'inline-block';
  const renderers = {
    dashboard: renderDashboard, config: renderConfig, announcements: renderAnnouncementsAdmin,
    documents: renderDocumentsAdmin, activities: renderActivitiesAdmin, polls: renderPollsAdmin,
    residents: renderResidentsAdmin, audit: renderAuditLog, settings: renderSettings
  };
  const fn = renderers[module] || renderDashboard;
  document.getElementById('contentArea').innerHTML = fn();
}

function renderDashboard() {
  const annCount = (appData.announcements || []).length;
  const docCount = (appData.documents || []).length;
  const actCount = (appData.activities || []).length;
  const pollCount = (appData.polls || []).filter(p => p.status === '进行中').length;
  const resCount = (appData.residents || []).filter(r => r.status === 'active' && !r.isTest).length;
  const testCount = (appData.residents || []).filter(r => r.isTest).length;
  return '<div class="stats-grid">' +
    '<div class="stat-card"><div class="label">公告总数</div><div class="value">' + annCount + '</div></div>' +
    '<div class="stat-card"><div class="label">上级文件</div><div class="value">' + docCount + '</div></div>' +
    '<div class="stat-card"><div class="label">社区动态</div><div class="value">' + actCount + '</div></div>' +
    '<div class="stat-card"><div class="label">进行中投票</div><div class="value">' + pollCount + '</div></div>' +
    '</div><div class="stats-grid">' +
    '<div class="stat-card"><div class="label">正式业主</div><div class="value">' + resCount + '</div></div>' +
    '<div class="stat-card"><div class="label">测试数据</div><div class="value" style="color:var(--warning)">' + testCount + '</div></div>' +
    '</div><div class="card"><div class="card-header"><h3>🚀 快捷入口</h3></div>' +
    '<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px;">' +
    '<button class="btn btn-primary" onclick="navigateTo(\'announcements\');openEditModal(\'announcements\',null)">➕ 发布公告</button>' +
    '<button class="btn btn-primary" onclick="navigateTo(\'activities\');openEditModal(\'activities\',null)">➕ 发布动态</button>' +
    '<button class="btn btn-primary" onclick="navigateTo(\'polls\');openEditModal(\'polls\',null)">➕ 发起投票</button>' +
    '<button class="btn btn-primary" onclick="navigateTo(\'residents\');openEditModal(\'residents\',null)">➕ 添加业主</button>' +
    '</div></div>';
}

function renderConfig() {
  const c = appData.config && appData.config.community || {};
  const s = appData.config && appData.config.settings || {};
  const themes = s.themeOptions || [];
  return '<div class="card"><div class="card-header"><h3>🏘️ 社区基本信息</h3></div>' +
    '<div class="form-row"><div class="form-group"><label>社区名称</label><input type="text" id="cfgName" value="' + (c.name||'') + '"></div>' +
    '<div class="form-group"><label>地址</label><input type="text" id="cfgAddress" value="' + (c.address||'') + '"></div></div>' +
    '<div class="form-row"><div class="form-group"><label>总户数</label><input type="number" id="cfgUnits" value="' + (c.totalUnits||'') + '"></div>' +
    '<div class="form-group"><label>建成年份</label><input type="text" id="cfgYear" value="' + (c.builtYear||'') + '"></div></div>' +
    '<div class="form-row"><div class="form-group"><label>占地面积</label><input type="text" id="cfgArea" value="' + (c.area||'') + '"></div>' +
    '<div class="form-group"><label>物业公司</label><input type="text" id="cfgProperty" value="' + (c.propertyCompany||'') + '"></div></div>' +
    '<div class="form-row"><div class="form-group"><label>居委会电话</label><input type="text" id="cfgCommittee" value="' + (c.committeePhone||'') + '"></div>' +
    '<div class="form-group"><label>物业电话</label><input type="text" id="cfgPropertyPhone" value="' + (c.propertyPhone||'') + '"></div></div>' +
    '<div class="form-group"><label>社区口号</label><input type="text" id="cfgSlogan" value="' + (c.slogan||'') + '"></div></div>' +
    '<div class="card"><div class="card-header"><h3>🎨 主题设置</h3></div>' +

function generateCaseNo() {
  const year = new Date().getFullYear();
  const polls = appData.polls || [];
  const maxNum = polls.reduce((max, p) => {
    const match = p.caseNo && p.caseNo.match(/YJ-(\d+)/);
    return match ? Math.max(max, parseInt(match[1])) : max;
  }, 0);
  return year + '-YJ-' + String(maxNum + 1).padStart(3, '0');
}

async function saveItem(module, id) {
  const isNew = !id;
  let item = isNew ? { id: generateId(module) } : (appData[module] || []).find(x => x.id === id) || { id: id };
  if (module === 'announcements') {
    item.title = document.getElementById('edTitle').value;

    item.author = document.getElementById('edAuthor').value;
    item.isPinned = document.getElementById('edPinned').checked;
    item.content = document.getElementById('edContent').value;
    item.views = item.views || 0;
    item.attachments = item.attachments || [];
  } else if (module === 'documents') {
    item.title = document.getElementById('edTitle').value;
    item.source = document.getElementById('edSource').value;
    item.publishDate = document.getElementById('edDate').value;
    item.fileUrl = document.getElementById('edFileUrl').value;
    item.description = document.getElementById('edDesc').value;
    item.category = '上级文件';
  } else if (module === 'activities') {
    item.title = document.getElementById('edTitle').value;
    item.date = document.getElementById('edDate').value;
    item.location = document.getElementById('edLocation').value;
    item.status = document.getElementById('edStatus').value;
    item.videoUrl = document.getElementById('edVideo').value;
    item.externalLink = document.getElementById('edExternal').value;
    item.content = document.getElementById('edContent').value;
    item.coverImage = item.coverImage || '';
    item.images = item.images || [];
  } else if (module === 'polls') {
    item.caseNo = document.getElementById('edCaseNo').value;
    item.title = document.getElementById('edTitle').value;
    item.startDate = document.getElementById('edStart').value;
    item.endDate = document.getElementById('edEnd').value;
    item.status = document.getElementById('edStatus').value;
    item.tencentUrl = document.getElementById('edTencent').value;
    item.progress = { target: parseInt(document.getElementById('edTarget').value)||0, current: parseInt(document.getElementById('edCurrent').value)||0, unit: '户' };
    item.results = { isPublished: document.getElementById('edPublishResult').checked, summary: document.getElementById('edResultSummary').value, detailUrl: '' };
    item.description = document.getElementById('edDesc').value;
    item.type = item.type || 'opinion';
    item.createdBy = item.createdBy || currentAdmin && currentAdmin.name;
    item.createdAt = item.createdAt || new Date().toISOString();
  } else if (module === 'residents') {
    item.roomNo = document.getElementById('edRoom').value;
    item.name = document.getElementById('edName').value;
    item.phoneSuffix = document.getElementById('edPhone').value;
    item.status = document.getElementById('edStatus').value;
    item.isTest = document.getElementById('edTest').checked;
    item.registeredAt = item.registeredAt || new Date().toISOString().split('T')[0];
  }
  const list = appData[module] || [];
  const idx = list.findIndex(x => x.id === item.id);
  if (idx >= 0) list[idx] = item; else list.push(item);
  appData[module] = list;
  const action = isNew ? 'create' : 'update';
  const detail = (isNew ? '新增' : '更新') + getModuleName(module) + '《' + (item.title || item.name || '') + '》';
  closeModal(); showLoading(true);
  try {
    await saveDataFile(module, list, detail, action);
    showToast('保存成功', 'success');
    navigateTo(module);
  } catch(e) {
    showToast('保存失败：' + e.message, 'error');
  } finally {

  }
}

async function saveDataFile(filename, data, detail, action) {
  action = action || 'update';
  const ownerRepo = await getRepoInfo();
  if (!ownerRepo) throw new Error('无法获取仓库信息');
  const owner = ownerRepo[0], repo = ownerRepo[1];
  const path = 'data/' + filename + '.json';
  const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!getRes.ok) throw new Error('无法读取文件，请检查Token权限');
  const fileInfo = await getRes.json();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const putRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: '[' + (currentAdmin && currentAdmin.name || '') + '] ' + detail, content: content, sha: fileInfo.sha })
  });
  if (!putRes.ok) {
    const err = await putRes.json();
    throw new Error(err.message || '保存失败');
  }
  await appendAuditLog(action, filename, data.id || '', detail);
}

async function appendAuditLog(action, target, targetId, detail) {
  const log = appData['audit-log'] || [];
  log.push({
    id: 'log-' + Date.now(),
    timestamp: new Date().toISOString(),
    adminName: currentAdmin && currentAdmin.name || '未知',
    adminId: currentAdmin && currentAdmin.id || '',
    action: action,
    target: target,
    targetId: targetId,
    details: detail,
    clientInfo: navigator.userAgent
  });
  appData['audit-log'] = log;
  const ownerRepo = await getRepoInfo();
  if (!ownerRepo) return;
  const owner = ownerRepo[0], repo = ownerRepo[1];
  const path = 'data/audit-log.json';
  try {
    const getRes = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
      headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!getRes.ok) return;
    const fileInfo = await getRes.json();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(log, null, 2))));
    await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: '[' + (currentAdmin && currentAdmin.name || '') + '] 审计日志更新', content: content, sha: fileInfo.sha })
    });
  } catch(e) { console.error('审计日志保存失败', e); }
}

async function getRepoInfo() {
  try {
    const r = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': 'token ' + githubToken }
    });
    if (!r.ok) return null;
    const user = await r.json();
    const path = window.location.pathname;
    const parts = path.split('/');
    if (parts.length >= 2) return [user.login, parts[1]];
    return null;
  } catch(e) { return null; }
}

async function doBatchImport() {
  const text = document.getElementById('batchData').value.trim();
  if (!text) { showToast('请输入数据', 'error'); return; }
  const lines = text.split('\n');
  const newResidents = [];
  let success = 0, fail = 0;
  lines.forEach(line => {
    line = line.trim();
    if (!line) return;
    const parts = line.split(/[\t|\|\s]+/);
    if (parts.length >= 3) {
      const room = parts[0].trim();
      const name = parts[1].trim();
      const suffix = parts[2].trim().replace(/[^0-9]/g, '').substring(0,4);
      if (room && name && suffix) {
        newResidents.push({ id: 'r-' + Date.now() + '-' + Math.random().toString(36).substr(2,4), roomNo: room, name: name, phoneSuffix: suffix, status: 'active', isTest: false, registeredAt: new Date().toISOString().split('T')[0] });
        success++;
      } else { fail++; }
    } else { fail++; }
  });
  if (newResidents.length === 0) { showToast('未解析到有效数据', 'error'); return; }
  const list = appData.residents || [];
  list.push.apply(list, newResidents);
  appData.residents = list;
  closeModal(); showLoading(true);
  try {
    await saveDataFile('residents', list, '批量导入 ' + success + ' 位业主', 'batch-import');
    showToast('成功导入 ' + success + ' 位业主' + (fail?'，' + fail + '行失败':''), 'success');
    navigateTo('residents');
  } catch(e) {
    showToast('导入失败：' + e.message, 'error');
  } finally {
    showLoading(false);
  }
}

async function changePassword() {
  const oldPwd = document.getElementById('oldPassword').value;
  const newPwd = document.getElementById('newPassword').value;
  const confirmPwd = document.getElementById('confirmPassword').value;
  if (!oldPwd || !newPwd || !confirmPwd) { showToast('请填写所有字段', 'error'); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }
  if (newPwd.length < 8 || !/[a-zA-Z]/.test(newPwd) || !/[0-9]/.test(newPwd)) { showToast('新密码需8位以上且同时包含字母和数字', 'error'); return; }
  const oldHash = await sha256(oldPwd + SALT);
  if (oldHash !== appData.config.auth.passwordHash) { showToast('当前密码错误', 'error'); return; }
  const newHash = await sha256(newPwd + SALT);
  appData.config.auth.passwordHash = newHash;
  appData.config.auth.lastChanged = new Date().toISOString().split('T')[0];
  showLoading(true);
  try {
    await saveDataFile('config', appData.config, '修改管理密码', 'password-change');
    showToast('密码修改成功，请重新登录', 'success');
    setTimeout(() => { logout(); }, 1500);
  } catch(e) {
    showToast('修改失败：' + e.message, 'error');
  } finally {
    showLoading(false);
  }
}

function showTokenModal() {
  document.getElementById('modalTitle').textContent = '🔑 更换 GitHub Token';
  document.getElementById('modalBody').innerHTML = '<div class="form-group"><label>新Token</label><input type="password" id="newToken" placeholder="ghp_xxxxxxxxxxxx"></div><p style="font-size:12px;color:var(--text-secondary);">Token 类型：classic，需勾选 repo 权限</p>';
  document.getElementById('modalFooter').innerHTML = '<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="updateToken()">保存</button>';
  document.getElementById('modalOverlay').classList.add('active');
}

async function updateToken() {
  const token = document.getElementById('newToken').value.trim();
  if (!token) { showToast('请输入Token', 'error'); return; }
  showLoading(true);
  try {
    const r = await fetch('https://api.github.com/user', { headers: { 'Authorization': 'token ' + token } });
    if (!r.ok) throw new Error('Token验证失败');
    githubToken = token;
    localStorage.setItem('githubToken', token);
    closeModal();
    showToast('Token已更新', 'success');
    navigateTo('settings');
  } catch(e) {
    showToast(e.message, 'error');
  } finally {
    showLoading(false);
  }
}

function generateId(module) {
  const prefix = { announcements: 'ann', documents: 'doc', activities: 'act', polls: 'poll', residents: 'r' };
  const list = appData[module] || [];
  const maxNum = list.reduce((max, item) => {
    const match = item.id && item.id.match(/\d+/);
    return match ? Math.max(max, parseInt(match[0])) : max;
  }, 0);
  return (prefix[module] || 'item') + '-' + String(maxNum + 1).padStart(3, '0');
}

function getModuleName(module) {
  const names = { announcements: '公告', documents: '文件', activities: '动态', polls: '投票', residents: '业主', config: '配置' };
  return names[module] || module;
}

function showLoading(show) {
  document.getElementById('loadingOverlay').classList.toggle('active', show);
}

function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
